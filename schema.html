<!DOCTYPE html>
<!--
================================================================================
 Nom        : schema.html
 Projet     : azs-cad - CAO de circuits imprimés
 Objet      : Saisie de schéma : pose des composants R, C, D, L et IC
 Auteur     : Eric PERRET
 Date       : 2026-10-31
 Version    : 0.5.0
 Dépendances: aucune (HTML/CSS/JavaScript natif, fonctionne hors ligne)
 Entrée     : bibliothèque .lib produite par bibliotheque.html
 Fichier    : <nom>.sch.dxf (AutoCAD R12, AC1009)
 Historique :
   0.1.0  2026-10-31  Chantier 4a : palette R / C / D / L / IC, valeur ou nom
                      à la pose,
                      repères automatiques, condensateur polarisé au-delà de
                      1 µF (forçable), déplacement, rotation, suppression,
                      modification au double-clic, annuler/rétablir
   0.1.1  2026-10-31  Plus de notion de gabarit dans le schéma (le choix se
                      fait sur le circuit) ; IC : « IC1.NE555 » au centre, seul
   0.2.0  2026-10-31  Chantier 4b : liaisons patte à patte à angles droits,
                      groupes (Ctrl+clic, Maj+clic = plage) et bus (peigne,
                      trait gras marqué N, peigne), appairage par numéro de
                      patte, refus si les nombres diffèrent ; type de liaison
                      Électrique / Ligne 50 Ω ; VCC+ et GND au clic droit ;
                      pad simple ; libellé des passifs placé du côté libre ;
                      fil sélectionné : coudes déplaçables (carré) et nouveau
                      coude (rond au milieu des segments) ; double-clic = effacer
   0.3.0  2026-10-31  Chantier 4c : enregistrement et ouverture en DXF R12
                      (calques COMPOSANTS, PATTES, TEXTES, LIAISONS,
                      LIGNES_50OHM, BUS, ALIMENTATIONS ; BLOCK/INSERT par
                      composant ; connectivité en XDATA, APPID AZSCAD)
   0.3.1  2026-10-31  Fils en bleu cobalt ; croisement de deux équipotentielles
                      différentes : encoche (saut) ; même équipotentielle : point
   0.3.2  2026-10-31  Clic dans le vide : repose le dernier composant posé,
                      même valeur, sans question
   0.3.3  2026-10-31  À l'enregistrement, publication du schéma pour board.html
                      ouvert dans le même navigateur (mise à jour du circuit)
   0.4.0  2026-10-31  Lien avec board.html : bouton Circuit, chaque page ouvre
                      l'autre ; publication du schéma à chaque changement dans
                      le stockage local du navigateur, sans enregistrement ni
                      rechargement ; bibliothèque partagée par son nom
   0.5.0  2026-10-31  Interface en français ou en anglais selon la langue du
                      navigateur ; projet renommé azs-cad (APPID DXF AZSCAD,
                      fichiers AIGLECAD toujours lus)

 Conventions des symboles (unités mm, grille 2,54) :
   R  zigzag              patte 1 à gauche, patte 2 à droite
   C  deux plaques        patte 1 = + si polarisé
   D  triangle et barre   patte 1 = K (cathode), patte 2 = A (anode)
   L  queue de cochon     patte 1 à gauche, patte 2 à droite
   PAD pastille seule     patte 1 (repère P1, valeur facultative)
   IC corps et pattes du 1er gabarit du composant, noms des pattes de la
      bibliothèque, « IC1.NE555 » au centre
================================================================================
-->

<head>
<meta charset="utf-8">

<title>azs-cad - Schéma</title>
<style>
  :root{
    --fond:#e9ecf0; --panneau:#fff; --bord:#d6dbe2; --texte:#1f2328;
    --discret:#6b7280; --accent:#1f6feb; --accentClair:#dbe7fd; --survol:#f2f5f9;
    --vert:#15803d; --err:#c62828; --avert:#b26a00;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--fond); color:var(--texte);
    font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:200px 1fr 270px;
    grid-template-areas:"barre barre barre" "gauche centre droite" "etat etat etat";
    overflow:hidden;
  }
  button,select,input{font:inherit; color:var(--texte); background:#fff; border:1px solid var(--bord); border-radius:5px; padding:4px 9px}
  button{cursor:pointer; background:#f6f7f9}
  button:hover:not(:disabled){border-color:var(--accent); background:#fff}
  button:disabled{opacity:.45; cursor:default}
  button.principal{background:var(--accent); border-color:var(--accent); color:#fff}
  button.principal:hover:not(:disabled){background:#1a5fd0; color:#fff}
  input:focus,select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accentClair)}

  #barre{grid-area:barre; display:flex; align-items:center; gap:8px; padding:7px 12px; background:var(--panneau); border-bottom:1px solid var(--bord)}
  #barre .titre{font-weight:700; font-size:15px; margin-right:8px}
  #barre .titre span{color:var(--discret); font-weight:400; font-size:12px; margin-left:5px}
  #barre .espace{flex:1}
  #barre label{color:var(--discret)}
  #nomLib{color:var(--discret)}
  #modif{color:var(--avert); font-size:18px; width:12px}
  #fichierLib,#fichierSch{display:none}

  #gauche{grid-area:gauche; background:var(--panneau); border-right:1px solid var(--bord); display:flex; flex-direction:column; min-height:0}
  #gauche h3{margin:12px 0 6px; padding:0 12px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--discret)}
  #palette{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:0 10px}
  #palette button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 4px; font-weight:700}
  #palette button svg{width:56px; height:22px; stroke:#1f2328; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  #palette button.actif{border-color:var(--accent); background:var(--accentClair)}
  #listePosee{flex:1; overflow:auto; min-height:0; list-style:none; margin:0; padding:0 0 10px}
  #listePosee li{padding:4px 12px; cursor:pointer; border-left:3px solid transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #listePosee li:hover{background:var(--survol)}
  #listePosee li.sel{background:var(--accentClair); border-left-color:var(--accent)}

  #centre{grid-area:centre; position:relative; min-width:0; min-height:0; background:#fff}
  #cv{position:absolute; inset:0; width:100%; height:100%; display:block}
  .vide{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; pointer-events:none; padding:20px; font-size:14px; color:#9aa1ab}

  #droite{grid-area:droite; background:var(--panneau); border-left:1px solid var(--bord); overflow:auto; min-height:0}
  .bloc{padding:12px 14px; border-bottom:1px solid var(--bord)}
  .bloc h4{margin:0 0 8px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--discret)}
  .grandNom{font-size:18px; font-weight:700}
  .champ{display:grid; grid-template-columns:92px 1fr; gap:6px; align-items:center; margin-bottom:7px}
  .champ label{color:var(--discret)}
  .champ input,.champ select{width:100%; min-width:0}
  .boutons{display:flex; flex-wrap:wrap; gap:6px}
  .stat{color:var(--discret)}
  .avert{color:var(--avert); font-size:12px; margin-top:4px}

  #etat{grid-area:etat; display:flex; gap:18px; padding:4px 12px; background:var(--panneau); border-top:1px solid var(--bord); color:var(--discret); white-space:nowrap; overflow:hidden; font-size:12px}
  #coord{font-family:ui-monospace,Consolas,monospace; color:var(--texte); min-width:200px}
  #aide{color:var(--texte)}
  #msg.erreur{color:var(--err)}
  #bulle{position:fixed; pointer-events:none; background:#1f2328; color:#fff; border-radius:5px; padding:3px 8px; font-size:12px; white-space:pre; display:none; z-index:25}

  #menu{position:fixed; display:none; z-index:30; background:#fff; border:1px solid var(--bord); border-radius:7px; box-shadow:0 6px 20px rgba(0,0,0,.18); padding:4px; min-width:140px}
  #menu .titreMenu{padding:4px 8px 6px; color:var(--discret); font-size:11px; text-transform:uppercase; letter-spacing:.05em}
  #menu .op{padding:5px 10px; border-radius:4px; cursor:pointer; font-weight:600}
  #menu .op:hover{background:var(--accentClair)}
  #modale{position:fixed; inset:0; background:rgba(20,24,30,.45); display:none; align-items:center; justify-content:center; z-index:40}
  #modale.visible{display:flex}
  .boite{background:#fff; border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,.3); width:min(420px,95vw); overflow:hidden}
  .boite h2{margin:0; padding:14px 18px; font-size:16px; border-bottom:1px solid var(--bord)}
  .boite .corps{padding:16px 18px}
  .boite .champ{grid-template-columns:100px 1fr}
  #dErreur{color:var(--err); font-size:12px; min-height:16px}
  .boite .pied{display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--bord); background:#fafbfc}
</style>
</head>

    <button data-t="IC" title="Circuit de la bibliothèque"><svg viewBox="0 0 56 22"><rect x="16" y="3" width="24" height="16"/><path d="M10 7h6M10 15h6M40 7h6M40 15h6"/></svg>IC</button>
  </div>
  <h3 id="titrePosee">Composants (0)</h3>
  <ul id="listePosee"></ul>
</div>

<div id="centre">
  <canvas id="cv"></canvas>

</div>

<div id="droite"><div id="fiche"></div></div>

<div id="etat">

  <span id="aide"></span>
  <span id="msg"></span>
</div>
<div id="bulle"></div>
<div id="menu"></div>

<div id="modale">
  <div class="boite">

    <div class="corps">
      <div class="champ" id="dLigneVal"><label for="dVal">Valeur</label><input type="text" id="dVal" spellcheck="false" autocomplete="off"></div>
      <div class="champ" id="dLigneNom"><label for="dNom">Composant</label><input type="text" id="dNom" list="listeNoms" spellcheck="false" autocomplete="off"></div>
      <div class="champ" id="dLignePol"><label for="dPol">Polarisé</label>
        <select id="dPol"><option value="auto">Auto (&gt; 1 µF)</option><option value="oui">Oui</option><option value="non">Non</option></select></div>
      <div id="dErreur"></div>
    </div>
    <div class="pied">
      <button id="dAnnuler">Annuler</button>
      <button id="dOk" class="principal">Poser</button>
    </div>
  </div>
</div>
<datalist id="listeNoms"></datalist>

      for (k = 0; k < bu.b.length; k++) l.push('B=' + bu.b[k].c + ':' + bu.b[k].p);
      d.polyligne('BUS', g.tronc, { largeur: 0.5, tirets: bu.type === 'rf' }, l);
      d.ligne('BUS', g.pa.barre[0].x, g.pa.barre[0].y, g.pa.barre[1].x, g.pa.barre[1].y);
      d.ligne('BUS', g.pb.barre[0].x, g.pb.barre[0].y, g.pb.barre[1].x, g.pb.barre[1].y);
      for (k = 0; k < g.pa.dents.length; k++) {
        d.ligne('BUS', g.pa.dents[k][0].x, g.pa.dents[k][0].y, g.pa.dents[k][1].x, g.pa.dents[k][1].y);
        d.ligne('BUS', g.pb.dents[k][0].x, g.pb.dents[k][0].y, g.pb.dents[k][1].x, g.pb.dents[k][1].y);
      }
      d.texte('TEXTES', milieu(g.tronc).x, milieu(g.tronc).y + 0.8, 1.27, String(bu.a.length));
    }
    d.g(0, 'ENDSEC').g(0, 'EOF');
    return d.l.join('\r\n') + '\r\n';
  }

  /* Lecture : seules les entités porteuses de XDATA AZSCAD sont reprises */
  function lireDxf(texte) {
    var l = texte.split(/\r?\n/), i, code, val, section = '', ents = [], cour = null, res = { comps: [], fils: [], bus: [], lib: '', err: [] },
        e, xd, k, kv, dern = null;
    for (i = 0; i + 1 < l.length; i += 2) {
      code = parseInt(l[i], 10); val = l[i + 1].replace(/^\s+|\s+$/g, '');
      if (code === 0) {
        if (val === 'SECTION' || val === 'ENDSEC' || val === 'EOF') { cour = null; if (val !== 'SECTION') section = ''; continue; }
        if (section === 'ENTITIES') { cour = { type: val, g: [] }; ents.push(cour); }
        else cour = null;
        continue;
      }
      if (code === 2 && !cour && section === '') { section = val; continue; }
      if (cour) cour.g.push([code, val]);
    }
    function x(ent) {
      var r = null, j;
      for (j = 0; j < ent.g.length; j++) {
        if (ent.g[j][0] === 1001) r = (ent.g[j][1] === 'AZSCAD' || ent.g[j][1] === 'AIGLECAD') ? [] : null;
        else if (r && ent.g[j][0] === 1000) r.push(dxfLire(ent.g[j][1]));
      }
      return r;
    }
    function v(ent, c) { var j; for (j = 0; j < ent.g.length; j++) if (ent.g[j][0] === c) return ent.g[j][1]; return null; }
    function cles(liste) {
      var o = { A: [], B: [] }, j, p, q;
      for (j = 1; j < liste.length; j++) {
        p = liste[j].indexOf('=');
        if (p < 0) continue;
        kv = [liste[j].slice(0, p), liste[j].slice(p + 1)];
        if (kv[0] === 'A' || kv[0] === 'B') { q = kv[1].indexOf(':'); o[kv[0]].push({ c: parseInt(kv[1].slice(0, q), 10), p: kv[1].slice(q + 1) }); }
        else o[kv[0]] = kv[1];
      }
      return o;
    }
    for (i = 0; i < ents.length; i++) {
      e = ents[i];
      if (e.type === 'VERTEX') { if (dern) dern.push({ x: lireNb(v(e, 10)), y: lireNb(v(e, 20)) }); continue; }
      if (e.type === 'SEQEND') { dern = null; continue; }
      xd = x(e);
      if (!xd || !xd.length) continue;
      k = cles(xd);
      if (xd[0] === 'SCHEMA') res.lib = k.LIB || '';
      else if (xd[0] === 'COMP') {
        res.comps.push({ id: parseInt(k.ID, 10), type: k.TYPE, ref: k.REF || '', val: k.VAL || '', pol: k.POL || '',
                         x: lireNb(v(e, 10)) || 0, y: lireNb(v(e, 20)) || 0, rot: lireNb(v(e, 50)) || 0 });
      } else if (xd[0] === 'FIL') {
        dern = [];
        res.fils.push({ a: k.A[0], b: k.B[0], type: k.TYPE || 'n', pts: k.TRACE === 'manuel' ? dern : null });
      } else if (xd[0] === 'BUS') {
        res.bus.push({ a: k.A, b: k.B, type: k.TYPE || 'n' });
      }
    }
    for (i = 0; i < res.fils.length; i++) if (res.fils[i].pts) res.fils[i].pts = res.fils[i].pts.slice(1, -1);
    return res;
  }
  function enregistrerSchema() {
    var nom = ($('nomSch').value || 'schema').replace(/^\s+|\s+$/g, '').replace(/\s+/g, '_'), a, url, texte;
    if (!/\.dxf$/i.test(nom)) nom += '.sch.dxf';
    $('nomSch').value = nom;
    texte = ecrireDxf();
    url = URL.createObjectURL(new Blob([texte], { type: 'application/dxf' }));
    a = document.createElement('a'); a.href = url; a.download = nom;
    stocker(CLE.sch + nom, texte);
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    S.modifie = false; $('modif').textContent = '';
    message('Enregistré : ' + nom);
  }
  function ouvrirSchema(texte, nom) {
    var r = lireDxf(texte), i, max = 0;
    if (!r.comps.length && !r.fils.length) { message('Aucun schéma azs-cad dans ' + nom, true); return; }
    S.comps = r.comps; S.fils = r.fils; S.bus = r.bus;
    for (i = 0; i < S.comps.length; i++) max = Math.max(max, S.comps[i].id);
    S.nId = max + 1;
    S.sel = null; S.selL = null; S.lien = null; S.groupe = []; S.groupeA = null; S.annul = []; S.retab = [];
    S.modifie = false; $('modif').textContent = '';
    $('nomSch').value = nom;
    publierSch(true);
    message(S.comps.length + ' élément(s), ' + S.fils.length + ' liaison(s), ' + S.bus.length + ' bus' +
      (r.lib && r.lib !== S.nomLib ? ' · bibliothèque attendue : ' + r.lib : ''), !!(r.lib && r.lib !== S.nomLib));
    ajusterVue();
    toutRafraichir();
  }
  function ajusterVue() {
    var b = [1e9, 1e9, -1e9, -1e9], i, m, w, h;
    for (i = 0; i < S.comps.length; i++) { m = bboxMonde(S.comps[i]); b[0] = Math.min(b[0], m[0]); b[1] = Math.min(b[1], m[1]); b[2] = Math.max(b[2], m[2]); b[3] = Math.max(b[3], m[3]); }
    if (b[0] > b[2]) { S.ox = S.W / 2; S.oy = S.H / 2; return; }
    w = Math.max(b[2] - b[0], 20); h = Math.max(b[3] - b[1], 20);
    S.z = Math.max(2, Math.min(40, Math.min((S.W - 160) / w, (S.H - 160) / h)));
    S.ox = S.W / 2 - (b[0] + b[2]) / 2 * S.z; S.oy = S.H / 2 + (b[1] + b[3]) / 2 * S.z;
  }

  /* ======================================================================
     Souris
     ====================================================================== */
  function pos(ev) { var r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  function composantSous(w) {
    var i, c, l, b, t = 4 / S.z;
    for (i = S.comps.length - 1; i >= 0; i--) {
      c = S.comps[i]; l = versLocalComp(c, w.x, w.y); b = bboxLocale(c);
      if (l[0] >= b[0] - t && l[0] <= b[2] + t && l[1] >= b[1] - t && l[1] <= b[3] + t) return c;
    }
    return null;
  }
  function patteSous(w) {
    var i, j, pl, d, best = null, bd = 8 / S.z;
    for (i = 0; i < S.comps.length; i++) {
      pl = pattesMonde(S.comps[i]);
      for (j = 0; j < pl.length; j++) {
        d = Math.sqrt((w.x - pl[j].wx) * (w.x - pl[j].wx) + (w.y - pl[j].wy) * (w.y - pl[j].wy));
        if (d < bd) { bd = d; best = { c: S.comps[i], p: pl[j].nom, f: pl[j].f }; }
      }
    }
    return best;
  }
  function bulle(ev, t) {
    var b = $('bulle');
    if (!t) { b.style.display = 'none'; return; }
    b.textContent = t; b.style.display = 'block'; b.style.left = (ev.clientX + 14) + 'px'; b.style.top = (ev.clientY + 16) + 'px';
  }
  cv.addEventListener('wheel', function (ev) {
    var m = pos(ev), f = ev.deltaY < 0 ? 1.2 : 1 / 1.2, nz = Math.min(Math.max(S.z * f, 1), 400);
    ev.preventDefault();
    f = nz / S.z; S.ox = m.x - (m.x - S.ox) * f; S.oy = m.y - (m.y - S.oy) * f; S.z = nz;
    dessiner();
  }, { passive: false });
  cv.addEventListener('mousedown', function (ev) {
    var m = pos(ev), w = versMonde(m.x, m.y), c, pt, l, occupe = !!(S.sel || S.selL || S.lien || S.groupe.length || S.groupeA);
    ev.preventDefault();
    bulle(null, '');
    if (S.pose) {
      if (ev.button === 0) deposer(); else if (ev.button === 2) annulerPose();
      return;
    }
    if (ev.button === 0 && S.selL) { l = poigneeFilSous(m); if (l) { saisirPoignee(l); return; } }
    pt = patteSous(w);
    if (ev.button === 2 && pt && pt.c.type !== 'PWR') { ouvrirMenuAlim(ev, pt); return; }
    if (ev.button === 0) {
      if (pt) {
        if (ev.ctrlKey || ev.metaKey || ev.shiftKey) { if (pt.c.type !== 'PWR') clicGroupe(pt, ev.shiftKey); }
        else clicPatte(pt);
        return;
      }
      if (S.lien || S.groupe.length || S.groupeA) annulerLiaison();
      l = liaisonSous(w);
      if (l) { S.selL = l; S.sel = null; toutRafraichir(); return; }
      c = composantSous(w);
      if (c) {
        S.sel = c; S.selL = null;
        S.drag = { c: c, x0: accroche(w.x), y0: accroche(w.y), cx: c.x, cy: c.y, avant: instantane(), bouge: false };
        toutRafraichir();
        return;
      }
      if (S.sel || S.selL) { S.sel = null; S.selL = null; toutRafraichir(); }
    }
    S.pan = { x: m.x, y: m.y, ox: S.ox, oy: S.oy, bouge: false,
              ajout: ev.button === 0 && !occupe && S.dernierPose ? { x: accroche(w.x), y: accroche(w.y) } : null };
    cv.style.cursor = 'grabbing';
  });
  cv.addEventListener('dblclick', function (ev) {
    var m = pos(ev), w = versMonde(m.x, m.y), l = liaisonSous(w), c, k;
    if (l && !patteSous(w)) {
      empiler();
      k = S.fils.indexOf(l); if (k >= 0) S.fils.splice(k, 1);
      k = S.bus.indexOf(l); if (k >= 0) S.bus.splice(k, 1);
      S.selL = null; toutRafraichir();
      return;
    }
    c = composantSous(w);
    if (c && c.type !== 'PWR' && !patteSous(w)) ouvrirDialogue('modif', c.type, c);
  });
  cv.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  cv.addEventListener('mouseleave', function () { bulle(null, ''); if (S.survol) { S.survol = null; dessiner(); } });
  window.addEventListener('mousemove', function (ev) {
    var m = pos(ev), w = versMonde(m.x, m.y), x = accroche(w.x), y = accroche(w.y), pt, avant;
    if (S.pan) {
      if (Math.abs(m.x - S.pan.x) + Math.abs(m.y - S.pan.y) > 3) S.pan.bouge = true;
      S.ox = S.pan.ox + m.x - S.pan.x; S.oy = S.pan.oy + m.y - S.pan.y; dessiner(); return;
    }
    if (S.dragFil) { S.dragFil.f.pts[S.dragFil.i] = { x: x, y: y }; S.dragFil.bouge = true; dessiner(); return; }
    if (S.drag) {
      if (x - S.drag.x0 || y - S.drag.y0) S.drag.bouge = true;
      S.drag.c.x = arr(S.drag.cx + x - S.drag.x0); S.drag.c.y = arr(S.drag.cy + y - S.drag.y0);
      dessiner(); return;
    }
    if (ev.target !== cv) return;
    $('coord').textContent = 'X ' + x.toFixed(2) + ' mm   Y ' + y.toFixed(2) + ' mm';
    if (S.pose) { S.pose.x = x; S.pose.y = y; dessiner(); return; }
    S.curseur = { x: x, y: y };
    if (S.lien) dessiner();
    pt = patteSous(w);
    bulle(ev, pt ? (pt.c.type === 'PWR' ? pt.c.val : pt.c.ref + ' · patte ' + pt.p + (pt.f ? ' : ' + pt.f : '')) : '');
    avant = S.survol;
    S.survol = pt;
    if ((avant && (!pt || avant.c !== pt.c || avant.p !== pt.p)) || (!avant && pt)) dessiner();
    cv.style.cursor = pt ? 'crosshair' : (composantSous(w) || liaisonSous(w) ? 'pointer' : 'default');
  });
  window.addEventListener('mouseup', function () {
    if (S.dragFil) { relacherPoignee(); return; }
    if (S.pan) {
      if (!S.pan.bouge && S.pan.ajout) reposer(S.pan.ajout);
      S.pan = null; cv.style.cursor = 'default'; return;
    }
    if (S.drag) {
      if (S.drag.bouge) { empiler(S.drag.avant); }
      S.drag = null;
      toutRafraichir();
    }
  });

  /* ======================================================================
     Clavier
     ====================================================================== */
  document.addEventListener('keydown', function (ev) {
    var t = ev.target.tagName, k = ev.key;
    if ((ev.ctrlKey || ev.metaKey) && (k === 's' || k === 'S')) { ev.preventDefault(); enregistrerSchema(); return; }
    if ($('modale').className || t === 'INPUT' || t === 'SELECT') return;
    if ((ev.ctrlKey || ev.metaKey) && (k === 'z' || k === 'Z')) { ev.preventDefault(); if (ev.shiftKey) restaurer(S.retab, S.annul); else restaurer(S.annul, S.retab); return; }
    if ((ev.ctrlKey || ev.metaKey) && (k === 'y' || k === 'Y')) { ev.preventDefault(); restaurer(S.retab, S.annul); return; }
    if (k === 'Escape') {
      fermerMenu();
      if (S.pose) annulerPose();
      else if (S.lien || S.groupe.length || S.groupeA) annulerLiaison();
      else if (S.sel || S.selL) { S.sel = null; S.selL = null; toutRafraichir(); }
    }
    else if ((k === 'r' || k === 'R') && !ev.ctrlKey && !ev.metaKey) tourner();
    else if (k === 'Delete' || k === 'Backspace') { ev.preventDefault(); supprimer(); }
  });

  /* ======================================================================
     Bibliothèque, messages, démarrage
     ====================================================================== */
  function message(t, err) { var m = $('msg'); m.textContent = t || ''; m.className = err ? 'erreur' : ''; }
  function marquer() { S.modifie = true; $('modif').textContent = '●'; $('modif').title = 'Modifications non enregistrées'; publierSch(); }

  /* ======================================================================
     Lien schéma <-> circuit : le schéma est publié à chaque changement dans le
     stockage local du navigateur ; board.html le suit sans enregistrement
     ====================================================================== */
  var CLE = { sch: 'azs-cad.sch:', brd: 'azs-cad.brd:', lib: 'azs-cad.lib:' };
  var minuteurPub = null;
  function stocker(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lireStock(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function nomCourant() {
    var nom = ($('nomSch').value || 'schema').replace(/^\s+|\s+$/g, '').replace(/\s+/g, '_');
    return /\.dxf$/i.test(nom) ? nom : nom + '.sch.dxf';
  }
  function publierSch(immediat) {
    clearTimeout(minuteurPub);
    if (immediat) stocker(CLE.sch + nomCourant(), ecrireDxf());
    else minuteurPub = setTimeout(function () { stocker(CLE.sch + nomCourant(), ecrireDxf()); }, 400);
  }
  function ouvrirCircuitLie() {
    var nom = nomCourant();
    $('nomSch').value = nom;
    publierSch(true);
    window.open('board.html#sch=' + encodeURIComponent(nom), 'azs-cad_board');
  }
  /* Ouverture par lien : schema.html#sch=<nom> */
  function demarrerLien() {
    var h = /(?:^|[#&])sch=([^&]+)/.exec(location.hash), nom, t, lib, tl;
    if (!h) return;
    nom = decodeURIComponent(h[1]);
    if (nom === nomCourant() && S.comps.length) return;
    t = lireStock(CLE.sch + nom);
    if (!t) { message('Schéma ' + nom + ' introuvable dans ce navigateur.', true); return; }
    lib = lireDxf(t).lib;
    tl = lib ? lireStock(CLE.lib + lib) : null;
    if (tl && lib !== S.nomLib) chargerLib(tl, lib);
    ouvrirSchema(t, nom);
  }
  window.addEventListener('hashchange', demarrerLien);
  function chargerLib(texte, nom) {
    var r = lireLib(texte), dl = $('listeNoms'), i, o;
    LIB = r.lib;
    S.nomLib = nom;
    stocker(CLE.lib + nom, texte);
    $('nomLib').textContent = nom + ' · ' + LIB.composants.length + ' composant(s), ' + LIB.packages.length + ' gabarit(s)';
    dl.textContent = '';
    LIB.composants.slice().sort(function (a, b) { return triNat(a.nom, b.nom); }).forEach(function (c) {
      o = document.createElement('option'); o.value = c.nom; dl.appendChild(o);
    });
    message(r.err.length ? r.err.length + ' ligne(s) illisible(s) dans la bibliothèque' : 'Bibliothèque chargée.', r.err.length > 0);
    toutRafraichir();
  }
  $('btLib').addEventListener('click', function () { $('fichierLib').click(); });
  $('btEnregistrer').addEventListener('click', enregistrerSchema);
  $('btLienBrd').addEventListener('click', ouvrirCircuitLie);
  $('btOuvrir').addEventListener('click', function () {
    if (S.modifie && !confirm('Abandonner les modifications non enregistrées ?')) return;
    $('fichierSch').click();
  });
  $('fichierSch').addEventListener('change', function () {
    var f = this.files && this.files[0], lr;
    if (!f) return;
    lr = new FileReader();
    lr.onload = function () { ouvrirSchema(lr.result, f.name); };
    lr.readAsText(f, 'utf-8');
    this.value = '';
  });
  $('btNouveau').addEventListener('click', function () {
    if (S.modifie && !confirm('Abandonner les modifications non enregistrées ?')) return;
    S.comps = []; S.fils = []; S.bus = []; S.nId = 1; S.dernierPose = null; S.sel = null; S.selL = null; S.lien = null; S.groupe = []; S.groupeA = null;
    S.annul = []; S.retab = []; S.modifie = false; $('modif').textContent = ''; $('nomSch').value = 'schema.sch.dxf';
    S.ox = S.W / 2; S.oy = S.H / 2; message(''); toutRafraichir();
  });
  $('fichierLib').addEventListener('change', function () {
    var f = this.files && this.files[0], lr;
    if (!f) return;
    lr = new FileReader();
    lr.onload = function () { chargerLib(lr.result, f.name); };
    lr.readAsText(f, 'utf-8');
    this.value = '';
  });
  $('selGrille').addEventListener('change', function () { S.grille = parseFloat(this.value); dessiner(); });
  Array.prototype.forEach.call(document.querySelectorAll('#palette button'), function (b) {
    b.addEventListener('click', function () {
      var t = this.getAttribute('data-t');
      if (t === 'IC' && !LIB.composants.length) { message('Ouvrir d\'abord une bibliothèque contenant des composants.', true); return; }
      annulerPose();
      ouvrirDialogue('pose', t);
    });
  });
  window.addEventListener('resize', redimensionner);
  window.addEventListener('beforeunload', function (ev) { if (S.modifie) { ev.preventDefault(); ev.returnValue = ''; } });

  redimensionner();
  S.ox = S.W / 2; S.oy = S.H / 2;
  toutRafraichir();
  demarrerLien();
})();
</script>

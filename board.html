<!DOCTYPE html>
<!--
================================================================================
 Nom        : board.html
 Projet     : azs-cad - CAO de circuits imprimés
 Objet      : Circuit imprimé : import du schéma, gabarits, placement, chevelu
 Auteur     : Eric PERRET
 Date       : 2026-10-31
 Version    : 0.8.0
 Dépendances: aucune (HTML/CSS/JavaScript natif, fonctionne hors ligne)
 Entrées    : bibliothèque .lib (bibliotheque.html), schéma .sch.dxf (schema.html)
 Fichier    : <nom>.brd.dxf (AutoCAD R12, AC1009)
 Fabrication: <nom>-cuivre1.gtl … cuivre4.gbl, vernis .gts/.gbs, sérigraphie
              .gto/.gbo, contour .gko (Gerber RS-274X, mm 4.6), perçage .drl
              (Excellon, mm), regroupés dans <nom>-gerber.zip
 Historique :
   0.1.0  2026-10-31  Chantier 5a : import du schéma (composants, équipotentielles,
                      lignes 50 Ω), gabarit par composant (passifs : dernier
                      gabarit choisi pour le type ; IC : gabarits du composant
                      ou de mêmes pattes), placement, rotation, passage dessous,
                      chevelu (arbre couvrant minimal par équipotentielle),
                      texte IC1.NE555 fin, libre, recentrable, DXF R12
   0.2.0  2026-10-31  Chantier 5b : routage manuel 45°/90° sur cuivre 1 à 4,
                      via automatique au changement de couche, largeur 1 mm
                      puis dernière utilisée, lignes 50 Ω à largeur imposée
                      (FR4 1,6 / 0,8, εr 4,5), chevelu limité aux liaisons
                      non routées, sélection, déplacement et suppression
                      des segments et vias, pistes et vias en DXF
   0.3.0  2026-10-31  Gabarits normalisés générés (familles de la bibliothèque,
                      pastille seule traversante ou CMS au choix), choix parmi
                      les gabarits possibles, pré-placement selon le schéma,
                      chevelu jaune pointillé, double-clic : dé-routage,
                      un bouton coloré par couche, minimums PCBCart × 2
   0.3.1  2026-10-31  Chevelu qui suit le tracé en cours (depuis le curseur),
                      clic sur une pastille de la même équipotentielle sur une
                      autre couche : changement de couche et via automatiques,
                      pas de via sur une pastille traversante
   0.4.0  2026-10-31  Chantiers 5c à 5e : compteur des liaisons à router,
                      isolement contrôlé pendant le tracé (cercle mauve, pose
                      non refusée), clic droit sur une piste : largeur standard
                      ou saisie, composant déplacé/tourné/retourné/regabarité :
                      son cuivre repart en chevelu, mise à jour depuis le
                      schéma (bouton ou automatique quand schema.html enregistre
                      dans le même navigateur) sans toucher à l'inchangé
   0.5.0  2026-10-31  Départ du tracé sur la couche de la face du composant,
                      texte du composant collé (suit déplacement, rotation,
                      face ; Maj + glisser pour le décaler), textes libres de
                      sérigraphie (outil Texte, touche T), lien avec
                      schema.html : chaque page ouvre l'autre et la suit sans
                      enregistrement ni rechargement
   0.6.0  2026-10-31  Chantier 6 : contour (auto : carte de crédit puis
                      Europe ; ou format imposé, ou personnalisé), 4 mires
                      d'alignement à 3 mm des coins (cuivre, vernis,
                      sérigraphie, perçage), « AZS » sur toutes les couches,
                      export Gerber RS-274X par couche existante et Excellon,
                      textes en police au trait
   0.6.1  2026-10-31  Chevelu : part de l'extrémité libre d'un tracé interrompu
                      (clic droit, Échap) et, pendant le tracé, toujours du
                      curseur (plus de retour à la pastille de départ)
   0.6.2  2026-10-31  Fin de tracé sur une piste ou une via de la même
                      équipotentielle (toutes couches) : jonction, via posée
                      d'office si la piste est sur une autre couche ; via
                      reliée à toute piste qui la traverse ; double-clic =
                      reset : annule le tracé en cours (ou dé-route hors tracé)
   0.7.0  2026-10-31  Chantier 7 : aperçu Gerber avant téléchargement (relecture
                      des fichiers produits), miniatures vues de dessus, vue
                      agrandie avec couches superposables, transparence, zoom,
                      coordonnées et distance
   0.7.1  2026-10-31  Téléchargement de l'export en une archive <nom>-gerber.zip
   0.8.0  2026-10-31  Interface en français ou en anglais selon la langue du
                      navigateur ; projet renommé azs-cad (APPID DXF AZSCAD,
                      fichiers AIGLECAD toujours lus)

 Couches (DXF) : CUIVRE_1 (dessus) CUIVRE_2 CUIVRE_3 CUIVRE_4 (dessous)
                 VERNIS_DESSUS VERNIS_DESSOUS TEXTE_DESSUS TEXTE_DESSOUS
                 PERCAGE, plus CHEVELU et AZSCAD (données)
 Affichage     : fond noir, dessus rouge et blanc, dessous bleu, vue de dessus
================================================================================
-->

<head>

<title>azs-cad - Circuit</title>
<style>
  :root{
    --fond:#e9ecf0; --panneau:#fff; --bord:#d6dbe2; --texte:#1f2328;
    --discret:#6b7280; --accent:#1f6feb; --accentClair:#dbe7fd; --survol:#f2f5f9;
    --err:#c62828; --avert:#b26a00;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--fond); color:var(--texte);
    font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:220px 1fr 270px;
    grid-template-areas:"barre barre barre" "gauche centre droite" "etat etat etat";
    overflow:hidden;
  }
  button,select,input{font:inherit; color:var(--texte); background:#fff; border:1px solid var(--bord); border-radius:5px; padding:4px 9px}
  button{cursor:pointer; background:#f6f7f9}
  button:hover:not(:disabled){border-color:var(--accent); background:#fff}
  button:disabled{opacity:.45; cursor:default}
  button.principal{background:var(--accent); border-color:var(--accent); color:#fff}
  button.principal:hover:not(:disabled){background:#1a5fd0; color:#fff}
  input:focus,select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accentClair)}
  .cache{display:none}

  #barre{grid-area:barre; display:flex; align-items:center; gap:8px; padding:7px 12px; background:var(--panneau); border-bottom:1px solid var(--bord)}
  #barre .titre{font-weight:700; font-size:15px; margin-right:8px; white-space:nowrap}
  #barre button{white-space:nowrap}
  #barre .titre span{color:var(--discret); font-weight:400; font-size:12px; margin-left:5px}
  #barre .espace{flex:1}
  #barre label{color:var(--discret)}
  #nomBrd{width:170px}
  .couches{display:flex; gap:3px; margin-right:6px}
  .couches button{width:34px; padding:4px 0; border-width:2px}
  #modif{color:var(--avert); font-size:18px; width:12px}
  #infoSources{color:var(--discret); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  #gauche{grid-area:gauche; background:var(--panneau); border-right:1px solid var(--bord); display:flex; flex-direction:column; min-height:0}
  #gauche h3{margin:12px 0 6px; padding:0 12px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--discret)}
  #gauche .actions{display:flex; flex-direction:column; gap:6px; padding:10px 10px 0}
  #liste{flex:1; overflow:auto; min-height:0; list-style:none; margin:0; padding:0 0 10px}
  #liste li{padding:4px 12px; cursor:pointer; border-left:3px solid transparent; display:flex; justify-content:space-between; gap:6px; white-space:nowrap}
  #liste li:hover{background:var(--survol)}
  #liste li.sel{background:var(--accentClair); border-left-color:var(--accent)}
  #liste li .g{color:var(--discret); font-size:12px}
  #liste li.dessous .n{color:#2f5fbf}
  #liste li.manque .g{color:var(--err)}

  #centre{grid-area:centre; position:relative; min-width:0; min-height:0; background:#000}
  #cv{position:absolute; inset:0; width:100%; height:100%; display:block}
  .vide{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; pointer-events:none; padding:20px; font-size:14px; color:#666}

  #droite{grid-area:droite; background:var(--panneau); border-left:1px solid var(--bord); overflow:auto; min-height:0}
  .bloc{padding:12px 14px; border-bottom:1px solid var(--bord)}
  .bloc h4{margin:0 0 8px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--discret)}
  .grandNom{font-size:18px; font-weight:700}
  .champ{display:grid; grid-template-columns:86px 1fr; gap:6px; align-items:center; margin-bottom:7px}
  .champ label{color:var(--discret)}
  .champ select,.champ input{width:100%; min-width:0}
  .boutons{display:flex; flex-wrap:wrap; gap:6px}
  .stat{color:var(--discret)}
  .avert{color:var(--err); font-size:12px; margin-top:4px}

  #etat{grid-area:etat; display:flex; gap:18px; padding:4px 12px; background:var(--panneau); border-top:1px solid var(--bord); color:var(--discret); white-space:nowrap; overflow:hidden; font-size:12px}
  #coord{font-family:ui-monospace,Consolas,monospace; color:var(--texte); min-width:200px}
  #aide{color:var(--texte)}
  #msg.erreur{color:var(--err)}
  #reste{font-weight:600}
  #isol{color:#9b30d9; font-weight:600}
  #menu{position:fixed; display:none; z-index:30; background:#fff; border:1px solid var(--bord); border-radius:6px; box-shadow:0 6px 18px rgba(0,0,0,.18); padding:4px 0; min-width:150px}
  #menu .titre{padding:4px 12px 6px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--discret); border-bottom:1px solid var(--bord); margin-bottom:3px}
  #menu .option{padding:3px 12px; cursor:pointer}
  #menu .option:hover{background:var(--accentClair)}
  #menu .option.actuel{font-weight:700; color:var(--accent)}
  #menu .info{padding:4px 12px; color:var(--discret)}
  #menu input{margin:4px 8px; width:calc(100% - 16px)}
  #apercu{position:fixed; inset:0; z-index:40; background:#141414; display:flex; flex-direction:column; color:#ddd}
  #apercu.cache{display:none}
  .apBarre{display:flex; align-items:center; gap:10px; padding:8px 14px; background:#202020; border-bottom:1px solid #333}
  .apBarre b{font-size:15px; color:#fff}
  .apBarre .espace{flex:1}
  #apInfo{color:#9a9a9a}
  #apCorps{flex:1; min-height:0; display:flex}
  #apPlanche{flex:1; overflow:auto; padding:16px; display:flex; flex-wrap:wrap; gap:16px; align-content:flex-start}
  #apPlanche.cache,#apVue.cache,#apRetour.cache{display:none}
  .apMini{background:#1c1c1c; border:1px solid #333; border-radius:6px; padding:8px; cursor:pointer}
  .apMini:hover{border-color:var(--accent)}
  .apTitre{font-weight:600; color:#fff; margin-bottom:6px}
  .apLoupe{position:relative; margin-top:6px}
  .apLoupe canvas{display:block; border:1px solid #2a2a2a}
  .apLoupe span{position:absolute; right:6px; top:4px; font-size:10px; color:#666; letter-spacing:.08em}
  .apStat{font-size:11px; color:#8a8a8a; margin-top:6px; max-width:300px}
  #apVue{flex:1; display:flex; min-height:0}
  #apCouches{width:250px; overflow:auto; padding:10px; border-right:1px solid #333}
  .apLigne{display:grid; grid-template-columns:18px 12px 1fr 70px; gap:6px; align-items:center; margin-bottom:6px}
  .apPastille{width:12px; height:12px; border-radius:2px}
  .apNom{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .apLigne input[type=range]{width:70px; padding:0}
  #apCadre{flex:1; position:relative; min-width:0}
  #apCv{position:absolute; inset:0; display:block; cursor:grab}
  #apCoord{position:absolute; left:10px; bottom:8px; font-family:ui-monospace,Consolas,monospace; color:#ccc; background:rgba(0,0,0,.6); padding:2px 6px; border-radius:4px}
  #bulle{position:fixed; pointer-events:none; background:#1f2328; color:#fff; border-radius:5px; padding:3px 8px; font-size:12px; white-space:pre; display:none; z-index:25}
</style>
</head>

    message(B.comps.length + ' composant(s), ' + B.nets.length + ' équipotentielle(s)' + (manque ? ' · ' + manque + ' gabarit(s) absent(s)' + (r.lib && r.lib !== B.libNom ? ', bibliothèque attendue : ' + r.lib : '') : ''), manque > 0);
    ajusterVue(); toutRafraichir();
    suivreSchema();
  }

  /* ======================================================================
     Fichiers et démarrage
     ====================================================================== */
  function lireFichier(input, fn) {
    var f = input.files && input.files[0], lr;
    if (!f) return;
    lr = new FileReader();
    lr.onload = function () { fn(lr.result, f.name); };
    lr.readAsText(f, 'utf-8');
    input.value = '';
  }
  $('btLib').addEventListener('click', function () { $('fichierLib').click(); });
  $('fichierLib').addEventListener('change', function () {
    lireFichier(this, function (t, nom) {
      var r = lireLib(t);
      LIB = r.lib; B.libNom = nom; stocker(CLE.lib + nom, t);
      sources();
      message(LIB.composants.length + ' composant(s), ' + LIB.packages.length + ' gabarit(s)' + (B.libAttendue && B.libAttendue !== nom ? ' · attendue : ' + B.libAttendue : ''), !!(B.libAttendue && B.libAttendue !== nom));
      toutRafraichir();
    });
  });
  $('btSch').addEventListener('click', function () { $('fichierSch').click(); });
  $('fichierSch').addEventListener('change', function () { lireFichier(this, recevoirSchema); });
  $('btOuvrir').addEventListener('click', function () {
    if (B.modifie && !confirm('Abandonner les modifications non enregistrées ?')) return;
    $('fichierBrd').click();
  });
  $('fichierBrd').addEventListener('change', function () { lireFichier(this, ouvrirBrd); });
  $('btEnregistrer').addEventListener('click', enregistrerBrd);
  $('btLienSch').addEventListener('click', ouvrirSchemaLie);
  $('btTexte').addEventListener('click', outilTexte);
  $('btExport').addEventListener('click', exporterGerber);
  $('selGrille').addEventListener('change', function () { B.grille = parseFloat(this.value); dessiner(); });
  $('btPlacer').addEventListener('click', function () { choisirMode('placer'); });
  $('btRouter').addEventListener('click', function () { choisirMode('router'); });
  [1, 2, 3, 4].forEach(function (n) { $('btC' + n).addEventListener('click', function () { choisirCouche(n); this.blur(); }); });
  majBoutonsCouche();
  window.addEventListener('resize', redimensionner);
  window.addEventListener('beforeunload', function (ev) { if (B.modifie) { ev.preventDefault(); ev.returnValue = ''; } });

  redimensionner();
  B.ox = B.W / 2; B.oy = B.H / 2;
  sources();
  toutRafraichir();
  demarrerLien();
})();
</script>
</body>

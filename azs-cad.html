</div>
<div id="progression"><div class="boite"><div id="texteProgression"></div><progress id="barreProgression" max="6" value="0"></progress></div></div>
<input type="file" id="fichiersProjet" multiple>

 Format .lib (texte, unités mm, angles en degrés sens trigonométrique)
   # commentaire
   PACKAGE <gabarit>
     SOURCE  <origine> [référence…]        (facultatif, élément importé)
     LICENCE <non-diffusable|diffusable>   (facultatif, élément importé)
     PAD    <patte> <x> <y> <perçage> <diamètre> <ROND|CARRE|OVALE> [rot]   (DIL)
     SMD    <patte> <x> <y> <largeur> <hauteur> [rot]                       (CMS)
     TRAIT  <x1> <y1> <x2> <y2> <épaisseur>
     RECT   <x1> <y1> <x2> <y2> <épaisseur>
     ARC    <cx> <cy> <rayon> <angle début> <angle fin> <épaisseur>
     CERCLE <cx> <cy> <rayon> <épaisseur>
     POINT  <x> <y> <rayon>
     TEXTE  <x> <y> <hauteur> <rot> <texte…>
   FIN
   COMPOSANT <nom> <gabarit> [gabarit…]
     SOURCE  <origine> [référence…]
     LICENCE <non-diffusable|diffusable>
     <fonction> => <patte> [patte…]
   FIN
 Gabarits décrits face dessus. Pads DIL : cuivres 1 à 4 et perçage ;
 pads CMS : cuivre 1 ; traits, rectangles, arcs, cercles, points, textes :
 Texte dessus.

 Import externe (.zip fournisseur ou .lbr EAGLE XML, coordonnées en mm)
   Source lue dans le zip : EAGLE/*.lbr, part_info.txt, license.txt.
   Calques EAGLE repris : 1 (CMS dessus), pads traversants, 21 tPlace,
   25 tNames et 27 tValues (graphismes seuls) ; 51 tDocu ignoré.
   Licence (SOURCE, LICENCE) : information affichée, rien n'est diffusé.

 Bibliothèque et projet
   Bibliothèque ouverte : une seule à la fois, modifiable (Ctrl+S).
   Projet (ex. radio_vhf.lib) : reçoit les composants et gabarits cochés ;
   le gabarit d'un composant coché suit. Ouvrir le projet existant en début
   de session pour le compléter ; même nom = remplacé par la version cochée.
   Lecture seule ; décocher ou « Retirer du projet » l'enlève (Ctrl+Maj+S).
   Importés (.zip / .lbr) : gardés pour la session ; cochés, ils vont dans
   le projet, sinon ils sont perdus à la fermeture de la page.
   Passage au schéma : Schéma ↗ enregistre le projet (<nom>.lib) et ouvre

<script>

  }
  function majCircuit() {
    var s = api('sch'), b = api('brd');

    P.texteBrd = s.texte();
    b.recevoirSchema(P.texteBrd, s.nom());

  }

  /* --- Projet --- */
  function nomBase(n) { return String(n || '').replace(/^\s+|\s+$/g, '').replace(/\.lib$/i, '').replace(/\s+/g, '_'); }
  function nommer(base) {

    monter(function () {
      var f = P.projet.fichier;
      api('lib').chargerProjet('', f);
      api('sch').chargerLib('', f); api('sch').nommer(base + '.sch.dxf');
      api('brd').chargerLib('', f); api('brd').nommer(base + '.brd.dxf');
      P.texteBrd = '';
      cacherAccueil();
      montrer('lib');
    });
  }
  /* --- Projet en un seul fichier <base>.azs.zip : <base>.lib, <base>.sch.dxf, <base>.brd.dxf (DXF R12)
         Écriture : archive « stockée » (sans compression), noms et textes en UTF-8, CRC-32 EDB88320.
         Lecture : méthodes 0 (stockée) et 8 (deflate, DecompressionStream), dossiers ignorés --- */
  var TABLE_CRC = null;
  function crc32(o) {
    var c, i, k;
    if (!TABLE_CRC) { TABLE_CRC = []; for (i = 0; i < 256; i++) { c = i; for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; TABLE_CRC[i] = c >>> 0; } }
    c = 0xFFFFFFFF;
    for (i = 0; i < o.length; i++) c = TABLE_CRC[(c ^ o[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zipProjet(fichiers) {
    var enc = new TextEncoder(), parts = [], central = [], pos = 0, tailleC = 0, d = new Date(), i, nom, don, crc, loc, cen, v,
        heure = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
        jour = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    for (i = 0; i < fichiers.length; i++) {
      nom = enc.encode(fichiers[i][0]); don = enc.encode(fichiers[i][1]); crc = crc32(don);
      loc = new DataView(new ArrayBuffer(30));
      loc.setUint32(0, 0x04034b50, true); loc.setUint16(4, 20, true); loc.setUint16(6, 0x0800, true); loc.setUint16(8, 0, true);
      loc.setUint16(10, heure, true); loc.setUint16(12, jour, true); loc.setUint32(14, crc, true);
      loc.setUint32(18, don.length, true); loc.setUint32(22, don.length, true); loc.setUint16(26, nom.length, true); loc.setUint16(28, 0, true);
      cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint16(8, 0x0800, true); cen.setUint16(10, 0, true);
      cen.setUint16(12, heure, true); cen.setUint16(14, jour, true); cen.setUint32(16, crc, true);
      cen.setUint32(20, don.length, true); cen.setUint32(24, don.length, true); cen.setUint16(28, nom.length, true);
      cen.setUint16(30, 0, true); cen.setUint16(32, 0, true); cen.setUint16(34, 0, true); cen.setUint16(36, 0, true); cen.setUint32(38, 0, true);
      cen.setUint32(42, pos, true);
      parts.push(loc, nom, don); central.push(cen, nom);
      pos += 30 + nom.length + don.length; tailleC += 46 + nom.length;
    }
    v = new DataView(new ArrayBuffer(22));
    v.setUint32(0, 0x06054b50, true); v.setUint16(4, 0, true); v.setUint16(6, 0, true);
    v.setUint16(8, fichiers.length, true); v.setUint16(10, fichiers.length, true);
    v.setUint32(12, tailleC, true); v.setUint32(16, pos, true); v.setUint16(20, 0, true);

  function lireZipProjet(buf) {
    var dv = new DataView(buf), n = buf.byteLength, dec = new TextDecoder('utf-8'), i, fin = -1, nb, pos, lnom, lext, lcom, l = [];
    function err() { return new Error(T('Archive zip illisible')); }

      else if (x.meth !== 8) return Promise.reject(err());

    }));
  }
  function lire(f) {
    if (/\.zip$/i.test(f.name)) return f.arrayBuffer().then(lireZipProjet);
    return f.text().then(function (t) { return [{ nom: f.name, texte: t }]; });
  }
  /* Ouverture par étapes : la barre est affichée avant chaque étape (une image d'écran entre deux) */
  function progression(n, texte) {
    $('progression').className = n ? 'visible' : '';
    if (n) { $('barreProgression').value = n; $('texteProgression').textContent = T('Ouverture du projet') + ' · ' + T(texte) + '… (' + n + '/6)'; }
  }
  function etapes(l, i) {
    i = i || 0;
    if (i >= l.length) { progression(0); return; }
    progression(i + 3, l[i][0]);
    requestAnimationFrame(function () { setTimeout(function () {
      try { l[i][1](); } catch (e) { progression(0); afficherAccueil(); $('erreurAccueil').textContent = T('Lecture impossible') + (e && e.message ? ' : ' + e.message : ''); return; }
      etapes(l, i + 1);
    }, 0); });
  }
  function ouvrirFichiers(liste) {
    var fs = Array.prototype.slice.call(liste || []);
    if (!fs.length) return;
    progression(1, 'lecture du fichier');
    Promise.all(fs.map(lire)).then(function (paquets) {
      var lus = [].concat.apply([], paquets), libs = lus.filter(function (x) { return /\.(lib|txt)$/i.test(x.nom); }), sch = null, brd = null, lib, base;
      lus.forEach(function (x) {
        if (!/\.dxf$/i.test(x.nom)) return;

      });

          ['schéma', function () { if (sch) api('sch').ouvrirSchema(sch.texte, sch.nom); else api('sch').nommer(base + '.sch.dxf'); }],
          ['circuit', function () { if (brd) api('brd').ouvrirBrd(brd.texte, brd.nom); else api('brd').nommer(base + '.brd.dxf'); }],

  }
  /* Un seul téléchargement : <base>.azs.zip (bibliothèque du projet, schéma et circuit s'ils ne sont pas vides) */
  function enregistrerProjet() {
    var s = api('sch'), b = api('brd'), base, nom, f, url, a;
    if (!P.projet) return;
    base = P.projet.base; nom = base + '.azs.zip';
    f = [[base + '.lib', api('lib').sauver(nom)]];
    if (s && !s.vide()) f.push([base + '.sch.dxf', s.sauver(nom)]);
    if (b && !b.vide()) f.push([base + '.brd.dxf', b.sauver(nom)]);
    url = URL.createObjectURL(zipProjet(f));
    a = document.createElement('a'); a.href = url; a.download = nom;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }
  function abandonOk() { return !modifie() || confirm(T('Abandonner les modifications du projet en cours ?')); }
  function afficherAccueil() {
    $('erreurAccueil').textContent = '';
    $('btAnnulerAccueil').style.display = P.projet ? '' : 'none';
    $('accueil').className = 'visible';
    setTimeout(function () { $('nomNouveau').focus(); }, 30);
  }

  /* --- Interface des modules --- */
  window.AZS = {
    projetChange: function () {
      var t = api('lib').texteProjet();

      api('brd').chargerLib(t, P.projet.fichier);
    },
    schemaChange: majBandeau,
    majCircuit: majCircuit,
    enregistrerProjet: enregistrerProjet,
    nouveauProjet: function () { if (abandonOk()) afficherAccueil(); },
    ouvrirProjet: function () { if (abandonOk()) $('fichiersProjet').click(); }

    b.addEventListener('click', function () { if (P.projet) montrer(this.getAttribute('data-m')); });
  });

  $('btOuvrir').addEventListener('click', function () { $('fichiersProjet').click(); });
  $('fichiersProjet').addEventListener('change', function () { var l = this.files; ouvrirFichiers(l); this.value = ''; });
  $('btAnnulerAccueil').addEventListener('click', cacherAccueil);
  setInterval(function () {
    var m = modifie();
    $('modifProjet').textContent = m ? '●' : '';
    $('modifProjet').title = m ? T('Modifications non enregistrées') : '';
  }, 800);
  /* Ctrl+S quand le clavier est sur la page (barre d'onglets) */
  document.addEventListener('keydown', function (ev) {
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === 's' || ev.key === 'S')) { ev.preventDefault(); enregistrerProjet(); }
  });

  afficherAccueil();
})();

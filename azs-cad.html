<!DOCTYPE html>
<!--
================================================================================
 Nom        : azs-cad.html
 Projet     : azs-cad - CAO de circuits imprimés
 Objet      : Page unique : bibliothèque, schéma et circuit d'un même projet
 Auteur     : Eric PERRET
 Date       : 2026-11-02
 Version    : 1.2.0
 Dépendances: aucune (HTML/CSS/JavaScript natif, fonctionne hors ligne)
 Fichiers   : <projet>.lib (composants et gabarits du projet),
              <projet>.sch.dxf (schéma), <projet>.brd.dxf (circuit),
              bibliothèques de gabarits .lib communes à tous les projets
 Modules    : Bibliothèque 1.0.0, Schéma 1.1.0, Circuit 1.1.0 (cartouche et
              historique de chacun en tête de sa section <template>)
 Historique :
   1.0.0  2026-11-02  Chantier 7 : bibliotheque.html, schema.html et board.html
                      réunis dans une seule page à onglets ; un seul projet
                      actif, partagé en mémoire de la page (aucun stockage du
                      navigateur) ; accueil Créer / Ouvrir un projet ; Ctrl+S
                      enregistre le projet complet ; le circuit n'est jamais
                      modifié tout seul : « Mettre à jour le circuit » quand
                      le schéma a changé
   1.1.0  2026-11-02  Chantier 6b (Schéma 1.1.0) : choix de la fonction des
                      pattes multifonction, par composant posé ; le schéma et
                      le circuit acceptent les composants importés (SOURCE,
                      LICENCE)
   1.2.0  2026-11-02  Chantier 8a (Circuit 1.1.0) : grille Auto du circuit =
                      moitié du pas le plus fin des gabarits posés

 Utilisation :
   Créer un projet (nom) : onglet Bibliothèque ; ouvrir une bibliothèque de
   gabarits, cocher les composants utiles (copiés dans le projet).
   Ouvrir un projet : choisir ensemble <projet>.lib et, s'ils existent,
   <projet>.sch.dxf et <projet>.brd.dxf ; onglet Schéma.
   Ctrl+S (ou Fichier ▸ Enregistrer le projet) : télécharge <projet>.lib,
   <projet>.sch.dxf et <projet>.brd.dxf (ceux qui ne sont pas vides).

 Fonctionnement :
   Chaque module est une section <template> affichée dans son propre cadre
   (iframe srcdoc) : il garde ses identifiants, ses styles et ses raccourcis.
   La page relie les modules : objet AZS (page) et AZS_MODULE (module).
================================================================================
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>azs-cad</title>
<style>
  :root{
    --fond:#e9ecf0; --panneau:#fff; --bord:#d6dbe2; --texte:#1f2328;
    --discret:#6b7280; --accent:#1f6feb; --accentClair:#dbe7fd; --avert:#b26a00; --err:#c62828;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{background:var(--fond); color:var(--texte); font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden}
  button,input{font:inherit; color:var(--texte); background:#fff; border:1px solid var(--bord); border-radius:5px; padding:4px 10px}
  button{cursor:pointer; background:#f6f7f9}
  button:hover{border-color:var(--accent); background:#fff}
  button.principal{background:var(--accent); border-color:var(--accent); color:#fff}
  button.principal:hover{background:#1a5fd0}
  input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accentClair)}

  #onglets{position:absolute; left:0; right:0; top:0; height:36px; display:flex; align-items:flex-end; gap:2px; padding:0 10px; background:#1d2733; color:#cfd8e3}
  #onglets .marque{align-self:center; font-weight:700; color:#fff; margin-right:14px; white-space:nowrap}
  #onglets .marque span{font-weight:600; color:#9fc1ff; margin-left:6px}
  #onglets .onglet{border:none; border-radius:6px 6px 0 0; background:#2b3746; color:#cfd8e3; padding:7px 16px; font-weight:600}
  #onglets .onglet:hover{background:#364558; color:#fff}
  #onglets .onglet.actif{background:var(--fond); color:var(--texte)}
  #onglets .onglet .attente{color:#ffb547; margin-left:5px}
  #onglets .espace{flex:1}
  #bandeau{align-self:center; display:none; align-items:center; gap:8px; color:#ffd58a; margin-left:12px}
  #bandeau.visible{display:flex}
  #bandeau button{padding:3px 10px}
  #modifProjet{align-self:center; color:#ffb547; font-size:16px}

  #cadres{position:absolute; left:0; right:0; top:36px; bottom:0}
  #cadres iframe{position:absolute; inset:0; width:100%; height:100%; border:0; visibility:hidden; background:var(--fond)}
  #cadres iframe.actif{visibility:visible}

  #accueil{position:absolute; inset:0; z-index:10; display:none; align-items:center; justify-content:center; background:rgba(20,24,30,.55)}
  #accueil.visible{display:flex}
  #accueil .boite{background:#fff; border-radius:12px; box-shadow:0 14px 44px rgba(0,0,0,.35); width:min(520px,94vw); padding:22px 26px}
  #accueil h1{margin:0; font-size:22px}
  #accueil .sous{margin:2px 0 16px; color:var(--discret)}
  #accueil .bloc{border-top:1px solid var(--bord); padding:14px 0}
  #accueil h2{margin:0 0 8px; font-size:14px}
  #accueil .ligne{display:flex; gap:8px}
  #accueil .ligne input{flex:1}
  #accueil .aide{margin:6px 0 0; color:var(--discret); font-size:12px}
  #accueil #erreurAccueil{color:var(--err); min-height:18px; font-size:12px}
  #accueil .pied{display:flex; justify-content:flex-end}
  #fichiersProjet{display:none}
</style>
</head>
<body>

<div id="onglets">
  <span class="marque">azs-cad<span id="nomProjet"></span></span>
  <button class="onglet" data-m="lib">Bibliothèque</button>
  <button class="onglet" data-m="sch">Schéma</button>
  <button class="onglet" data-m="brd">Circuit</button>
  <span id="bandeau"><span id="texteBandeau">Le schéma a changé</span><button id="btMaj" class="principal">Mettre à jour le circuit</button></span>
  <span class="espace"></span>
  <span id="modifProjet"></span>
</div>

<div id="cadres">
  <iframe id="cadre-lib" title="Bibliothèque"></iframe>
  <iframe id="cadre-sch" title="Schéma"></iframe>
  <iframe id="cadre-brd" title="Circuit"></iframe>
</div>

<div id="accueil">
  <div class="boite">
    <h1>azs-cad</h1>
    <div class="sous">CAO de circuits imprimés</div>
    <div class="bloc">
      <h2>Créer un projet</h2>
      <div class="ligne"><input type="text" id="nomNouveau" placeholder="Nom du projet (ex. dvb)" spellcheck="false" autocomplete="off"><button id="btCreer" class="principal">Créer</button></div>
      <p class="aide">On commence par l'onglet Bibliothèque : cocher les composants utiles au projet.</p>
    </div>
    <div class="bloc">
      <h2>Ouvrir un projet</h2>
      <button id="btOuvrir">Ouvrir un projet…</button>
      <p class="aide">Choisir ensemble le fichier .lib du projet et, s'ils existent, ses fichiers .sch.dxf et .brd.dxf.</p>
    </div>
    <div id="erreurAccueil"></div>
    <div class="pied"><button id="btAnnulerAccueil">Annuler</button></div>
  </div>
</div>
<input type="file" id="fichiersProjet" multiple accept=".lib,.dxf,.txt">

<!-- ======================================================================
     Module Bibliothèque (ancien bibliotheque.html)
     ====================================================================== -->
<template id="module-lib">
<!--
================================================================================
 Nom        : azs-cad.html, module Bibliothèque (ancien bibliotheque.html)
 Projet     : azs-cad - CAO de circuits imprimés
 Objet      : Bibliothèque : composants (nom, gabarit, nom des pattes)
              et gabarits normalisés
 Auteur     : Eric PERRET
 Date       : 2026-11-02
 Version    : 1.0.0
 Dépendances: aucune (HTML/CSS/JavaScript natif, fonctionne hors ligne)
 Historique :
   0.1.0  2026-10-31  Lecteur de bibliothèques Eagle .lbr (abandonné)
   0.2.0  2026-10-31  Éditeur au format .lib
   0.3.0  2026-10-31  Chantier 3a : double vue SCH (fond blanc, pattes vertes)
                      et BRD (fond noir, cuivre rouge), assistant « Nouveau
                      composant » (famille, nombre de pattes, aperçu, nom),
                      gabarits normalisés DIL et CMS, ouverture/enregistrement
   0.3.1  2026-10-31  Chantier 3b : nommage des pattes (clic : saisie, Tab =
                      patte suivante ; clic droit : liste des fonctions),
                      tableau Patte | Nom synchronisé, annuler/rétablir
   0.3.2  2026-10-31  Chantier 3d : retouche des gabarits (barre d'outils
                      verticale : pads DIL/CMS, trait, arc, cercle, point,
                      texte ; sélection, cadre, déplacement, rotation,
                      duplication, suppression, propriétés, grille)
   0.3.3  2026-10-31  Chantier 3e : retouche = modifier l'existant (sélection,
                      déplacement, poignées, rotation, suppression, type DIL/CMS
                      changé sur place) ; création dans un mode « Dessiner » ;
                      contour de boîtier en RECT ; >NOM et >VALEUR retirés
   0.4.0  2026-10-31  Interface en français ou en anglais selon la langue du
                      navigateur ; projet renommé azs-cad
   0.5.0  2026-11-01  Chantier 5a : import de gabarits externes (.zip de
                      fournisseur ou .lbr EAGLE) : décompression native,
                      conversion pads / sérigraphie / brochage, aperçu SCH et
                      BRD, noms proposés (gabarit court, Fabricant_Référence),
                      SOURCE et LICENCE ; enregistrement des éléments non
                      diffusables dans prive_<source>.lib
   0.6.0  2026-11-01  Chantier 5b : multi-bibliothèque (ouverture de plusieurs
                      .lib ou d'un dossier, liste des bibliothèques ouvertes,
                      bibliothèque active, affichage groupé, déplacement d'un
                      composant ou d'un gabarit, enregistrement par fichier et
                      « Tout enregistrer », fichiers .lib autonomes)
   0.7.0  2026-11-01  Chantier 5b repris : une bibliothèque ouverte + un projet
                      (composants et gabarits cochés), importés gardés pour la
                      session, menu Fichier ; multi-bibliothèque, prive_*.lib
                      et séparation à l'enregistrement retirés
   0.8.0  2026-11-02  Chantier 6a : lien avec schema.html : bouton Schéma ↗,
                      projet publié dans le stockage local du navigateur à
                      chaque changement (le schéma le suit en direct),
                      ouverture par bibliotheque.html#proj=<nom>
   0.8.1  2026-11-02  Schéma ↗ enregistre le projet tel qu'il est puis ouvre le
                      schéma ; vue de gauche renommée PINOUT
   0.9.0  2026-11-02  Chantier 6a : on commence par créer ou ouvrir un projet
                      (sinon Nouveau composant, Nouveau gabarit, ouverture,
                      import et Schéma ↗ sont grisés) ; Schéma ↗ grisé tant
                      que la bibliothèque n'est pas enregistrée, sinon il
                      enregistre le projet et ouvre schema.html dans le même
                      onglet ; plus aucune mémoire partagée avec le schéma
   1.0.0  2026-11-02  Chantier 7 : module de azs-cad.html (page unique) ; le
                      projet est partagé en mémoire avec le schéma et le
                      circuit ; Nouveau / Ouvrir / Enregistrer le projet
                      (Ctrl+S) passent par la page ; plus de bibliothèque
                      fictive : sans bibliothèque de gabarits ouverte,
                      Nouveau composant et Nouveau gabarit sont grisés

 Format .lib (texte, unités mm, angles en degrés sens trigonométrique)
   # commentaire
   PACKAGE <gabarit>
     SOURCE  <origine> [référence…]        (facultatif, élément importé)
     LICENCE <non-diffusable|diffusable>   (facultatif, élément importé)
     PAD    <patte> <x> <y> <perçage> <diamètre> <ROND|CARRE|OVALE> [rot]   (DIL)
     SMD    <patte> <x> <y> <largeur> <hauteur> [rot]                       (CMS)
     TRAIT  <x1> <y1> <x2> <y2> <épaisseur>
     RECT   <x1> <y1> <x2> <y2> <épaisseur>
     ARC    <cx> <cy> <rayon> <angle début> <angle fin> <épaisseur>
     CERCLE <cx> <cy> <rayon> <épaisseur>
     POINT  <x> <y> <rayon>
     TEXTE  <x> <y> <hauteur> <rot> <texte…>
   FIN
   COMPOSANT <nom> <gabarit> [gabarit…]
     SOURCE  <origine> [référence…]
     LICENCE <non-diffusable|diffusable>
     <fonction> => <patte> [patte…]
   FIN
 Gabarits décrits face dessus. Pads DIL : cuivres 1 à 4 et perçage ;
 pads CMS : cuivre 1 ; traits, rectangles, arcs, cercles, points, textes :
 Texte dessus.

 Import externe (.zip fournisseur ou .lbr EAGLE XML, coordonnées en mm)
   Source lue dans le zip : EAGLE/*.lbr, part_info.txt, license.txt.
   Calques EAGLE repris : 1 (CMS dessus), pads traversants, 21 tPlace,
   25 tNames et 27 tValues (graphismes seuls) ; 51 tDocu ignoré.
   Licence (SOURCE, LICENCE) : information affichée, rien n'est diffusé.

 Bibliothèque et projet
   Bibliothèque ouverte : une seule à la fois, modifiable (Ctrl+S).
   Projet (ex. radio_vhf.lib) : reçoit les composants et gabarits cochés ;
   le gabarit d'un composant coché suit. Ouvrir le projet existant en début
   de session pour le compléter ; même nom = remplacé par la version cochée.
   Lecture seule ; décocher ou « Retirer du projet » l'enlève (Ctrl+Maj+S).
   Importés (.zip / .lbr) : gardés pour la session ; cochés, ils vont dans
   le projet, sinon ils sont perdus à la fermeture de la page.
   Passage au schéma : Schéma ↗ enregistre le projet (<nom>.lib) et ouvre
   schema.html dans le même onglet ; le schéma charge ce fichier (Projet…).
================================================================================
-->
<style>
  :root{
    --fond:#e9ecf0; --panneau:#fff; --bord:#d6dbe2; --texte:#1f2328;
    --discret:#6b7280; --accent:#1f6feb; --accentClair:#dbe7fd; --survol:#f2f5f9;
    --err:#c62828; --avert:#b26a00; --ok:#2e7d32;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--fond); color:var(--texte);
    font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:230px 1fr 280px;
    grid-template-areas:"barre barre barre" "gauche centre droite" "etat etat etat";
    overflow:hidden;
  }
  button,select,input{font:inherit; color:var(--texte); background:#fff; border:1px solid var(--bord); border-radius:5px; padding:4px 9px}
  button{cursor:pointer; background:#f6f7f9}
  button:hover:not(:disabled){border-color:var(--accent); background:#fff}
  button:disabled{opacity:.45; cursor:default}
  button.principal{background:var(--accent); border-color:var(--accent); color:#fff}
  button.principal:hover:not(:disabled){background:#1a5fd0; color:#fff}
  input:focus,select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accentClair)}

  #barre{grid-area:barre; display:flex; align-items:center; gap:8px; padding:7px 12px; background:var(--panneau); border-bottom:1px solid var(--bord)}
  #barre .titre{font-weight:700; font-size:15px; margin-right:8px}
  #barre .titre span{color:var(--discret); font-weight:400; font-size:12px; margin-left:5px}
  #nomFichier{width:190px}
  #modif{color:var(--avert); font-size:18px; width:12px}
  #fichier{display:none}

  #gauche{grid-area:gauche; background:var(--panneau); border-right:1px solid var(--bord); display:flex; flex-direction:column; min-height:0}
  #filtre{margin:10px 10px 4px; width:calc(100% - 20px)}
  #listes{flex:1; overflow:auto; min-height:0; padding-bottom:10px}
  .section h3{margin:10px 0 4px; padding:0 12px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--discret)}
  .section .ajout{margin:0 10px 6px; width:calc(100% - 20px); text-align:left}
  ul{list-style:none; margin:0; padding:0}
  li.item{padding:5px 12px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; border-left:3px solid transparent; white-space:nowrap}
  li.item:hover{background:var(--survol)}
  li.item.sel{background:var(--accentClair); border-left-color:var(--accent)}
  li.item .nom{overflow:hidden; text-overflow:ellipsis}
  li.item .info{color:var(--discret); font-size:12px; flex:none}

  #centre{grid-area:centre; display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--bord); min-width:0; min-height:0}
  .vue{position:relative; min-width:0; min-height:0; overflow:hidden}
  .vue canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  #vueSch{background:#fff} #vueBrd{background:#000}
  .etiquette{position:absolute; top:8px; left:10px; font-size:11px; font-weight:700; letter-spacing:.08em; padding:2px 7px; border-radius:4px; pointer-events:none}
  #vueSch .etiquette{color:#15803d; background:#ecfdf3}
  #vueBrd .etiquette{color:#f2b8b8; background:#2a1212}
  .vide{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; pointer-events:none; padding:20px; font-size:14px; color:#9aa1ab}

  #droite{grid-area:droite; background:var(--panneau); border-left:1px solid var(--bord); overflow:auto; min-height:0}
  .bloc{padding:12px 14px; border-bottom:1px solid var(--bord)}
  .bloc h4{margin:0 0 8px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--discret)}
  .grandNom{font-size:18px; font-weight:700; width:100%; padding:5px 8px}
  .stat{color:var(--discret); margin-top:6px}
  .boutons{display:flex; flex-wrap:wrap; gap:6px}
  .lien{color:var(--accent); cursor:pointer}
  .lien:hover{text-decoration:underline}
  .accueil{color:var(--discret); line-height:1.7}

  #etat{grid-area:etat; display:flex; gap:18px; padding:4px 12px; background:var(--panneau); border-top:1px solid var(--bord); color:var(--discret); white-space:nowrap; overflow:hidden; font-size:12px}
  #coord{font-family:ui-monospace,Consolas,monospace; color:var(--texte); min-width:200px}
  #msg.erreur{color:var(--err)}
  #bulle{position:fixed; pointer-events:none; background:#1f2328; color:#fff; border-radius:5px; padding:3px 8px; font-size:12px; white-space:pre; display:none; z-index:25}

  #modale{position:fixed; inset:0; background:rgba(20,24,30,.45); display:none; align-items:center; justify-content:center; z-index:40}
  #modale.visible{display:flex}
  .boite{background:#fff; border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,.3); width:min(720px,95vw); overflow:hidden}
  .boite h2{margin:0; padding:14px 18px; font-size:16px; border-bottom:1px solid var(--bord)}
  .boite .corps{display:grid; grid-template-columns:1fr 300px; gap:16px; padding:16px 18px}
  .champ{display:grid; grid-template-columns:100px 1fr; gap:6px; align-items:center; margin-bottom:8px}
  .champ label{color:var(--discret)}
  .champ input,.champ select{width:100%; min-width:0}
  #apercu{width:300px; height:230px; background:#000; border-radius:6px; display:block}
  #apercuInfo{color:var(--discret); font-size:12px; margin-top:6px; min-height:16px}
  #assErreur{color:var(--err); font-size:12px; min-height:16px}
  .boite .pied{display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--bord); background:#fafbfc}
  #barre .espace{flex:1}
  #barre label{color:var(--discret)}
  #modes{position:absolute; top:6px; right:8px; display:flex; gap:6px}
  #modes button{background:#1d1f23; color:#e6e6e6; border-color:#444; font-size:12px}
  #modes button:hover:not(:disabled){border-color:#f2b8b8; background:#2a2d33}
  #modes button.actif{background:#7a1f1f; border-color:#d63b3b; color:#fff}
  #outils.retouche [data-g="d"], #outils.dessin [data-g="r"]{display:none}
  #outils{position:absolute; left:8px; top:40px; display:none; flex-direction:column; gap:3px; background:#1d1f23; border:1px solid #3a3d44; border-radius:7px; padding:4px}
  #outils.visible{display:flex}
  #outils button{width:34px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; background:transparent; border-color:transparent; color:#cfd3da}
  #outils button:hover:not(:disabled){background:#2c3036; border-color:#555}
  #outils button.actif{background:#7a1f1f; border-color:#d63b3b; color:#fff}
  #outils .sep{height:1px; background:#3a3d44; margin:3px 2px}
  #outils svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  #aide{color:var(--texte)}
  table.broches{border-collapse:collapse; width:100%}
  table.broches td{padding:1px 0; border-bottom:1px solid #eef0f3}
  table.broches td.p{width:46px; color:var(--discret); font-variant-numeric:tabular-nums; padding-left:6px}
  table.broches tr.survol td{background:#fef9c3}
  table.broches input{width:100%; border-color:transparent; background:transparent; padding:3px 6px; font-weight:600}
  table.broches input:hover{border-color:var(--bord)}
  table.broches input:focus{background:#fff}
  #saisie{position:fixed; display:none; width:140px; z-index:20; box-shadow:0 3px 12px rgba(0,0,0,.25); font-weight:600}
  #menu{position:fixed; display:none; z-index:30; background:#fff; border:1px solid var(--bord); border-radius:7px; box-shadow:0 6px 20px rgba(0,0,0,.18); padding:4px; min-width:190px}
  #menu .titreMenu{padding:4px 8px 6px; color:var(--discret); font-size:11px; text-transform:uppercase; letter-spacing:.05em}
  #menu .grilleMenu{display:grid; grid-template-columns:repeat(3,1fr); gap:1px}
  #menu .op{padding:4px 8px; border-radius:4px; cursor:pointer; white-space:nowrap}
  #menu .op:hover{background:var(--accentClair)}
  #menu .op.actuel{font-weight:700; color:var(--accent)}

  /* ======================================================================

    for (i = 0; i < B.vias.length; i++) {
      f = B.vias[i];
      for (j = 1; j <= 4; j++) d.disque('CUIVRE_' + j, f.x, f.y, f.diam / 2);
      d.cercle('PERCAGE', f.x, f.y, f.perc / 2);
      d.g(0, 'POINT').g(8, 'AZSCAD').g(10, nb(f.x)).g(20, nb(f.y)).g(30, 0);

    for (i = 0; i < ch.length; i++) d.ligne('CHEVELU', ch[i].a.x, ch[i].a.y, ch[i].b.x, ch[i].b.y);

  }
  function lireBrd(texte) {
    var ents = lireDxfEntites(texte), r = { comps: [], nets: [], memo: {}, lib: '', sch: '', ok: false, pistes: [], vias: [], textes: [], contour: { type: 'auto', l: 100, h: 80 }, largeur: 1, via: { perc: 0.8, diam: 1.6 }, substrat: 1.6, isolement: 0.2 },

      e = ents[i];

      if (e.type === 'SEQEND') { if (dern && dern.pts.length >= 2) r.pistes.push(dern); dern = null; continue; }
      xd = xdata(e);
      if (!xd || !xd.length) continue;
      k = cles(xd);
      if (xd[0] === 'PISTE') dern = { couche: parseInt(k.COUCHE, 10) || 1, w: lireNb(k.W) || 1, net: k.NET || '', pts: [] };
      else if (xd[0] === 'TEXTE') r.textes.push({ x: lireNb(k.X) || 0, y: lireNb(k.Y) || 0, h: lireNb(k.H) || 1.5, rot: lireNb(k.ROT) || 0, dessous: k.FACE === 'dessous', txt: k.TXT || '' });
      else if (xd[0] === 'VIA') r.vias.push({ x: lireNb(k.X) || 0, y: lireNb(k.Y) || 0, perc: lireNb(k.PERC) || 0.8, diam: lireNb(k.DIAM) || 1.6, net: k.NET || '' });
      else if (xd[0] === 'BOARD') {
        r.ok = true; r.lib = k.LIB || ''; r.sch = k.SCH || '';
        if (lireNb(k.LARGEUR)) r.largeur = lireNb(k.LARGEUR);
        if (k.VIA && k.VIA.indexOf('/') > 0) r.via = { perc: lireNb(k.VIA.split('/')[0]) || 0.8, diam: lireNb(k.VIA.split('/')[1]) || 1.6 };
        if (lireNb(k.SUBSTRAT)) r.substrat = lireNb(k.SUBSTRAT);
        if (lireNb(k.ISOLEMENT)) r.isolement = lireNb(k.ISOLEMENT);
        m = /^(auto|carte|europe|perso):([\d.]+)x([\d.]+)$/.exec(k.CONTOUR || '');
        if (m) r.contour = { type: m[1], l: parseFloat(m[2]), h: parseFloat(m[3]) };
        m = (k.MEMO || '').split(';');
        for (j = 0; j < m.length; j++) if (m[j].indexOf(':') > 0) r.memo[m[j].slice(0, m[j].indexOf(':'))] = m[j].slice(m[j].indexOf(':') + 1);
      } else if (xd[0] === 'COMP') {
        r.comps.push({ id: parseInt(k.ID, 10), sid: parseInt(k.SID, 10), type: k.TYPE, ref: k.REF || '', val: k.VAL || '', pol: k.POL || '', gab: k.GAB || '',
                       dessous: k.FACE === 'dessous', tx: lireNb(k.TX) || 0, ty: lireNb(k.TY) || 0,
                       x: lireNb(groupe(e, 10)) || 0, y: lireNb(groupe(e, 20)) || 0, rot: lireNb(groupe(e, 50)) || 0 });

  function ouvrirBrd(texte, nom) {

<script>
/* ======================================================================
   Page hôte : onglets, accueil, projet actif partagé entre les modules
   ====================================================================== */
(function () {
  'use strict';
  var LANGUE = String((navigator.languages && navigator.languages[0]) || navigator.language || 'fr').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
  var EN = {
    'Bibliothèque': 'Library', 'Schéma': 'Schematic', 'Circuit': 'Board',
    'Le schéma a changé': 'The schematic has changed', 'Mettre à jour le circuit': 'Update the board',
    'Circuit vide': 'Empty board', 'Importer le schéma': 'Import the schematic',
    'CAO de circuits imprimés': 'Printed circuit board CAD', 'Créer un projet': 'Create a project', 'Créer': 'Create',
    'Nom du projet (ex. dvb)': 'Project name (e.g. dvb)', 'Ouvrir un projet': 'Open a project', 'Ouvrir un projet…': 'Open a project…',
    'On commence par l\'onglet Bibliothèque : cocher les composants utiles au projet.': 'Start with the Library tab: check the components the project needs.',
    'Choisir ensemble le fichier .lib du projet et, s\'ils existent, ses fichiers .sch.dxf et .brd.dxf.': 'Select together the project .lib file and, if they exist, its .sch.dxf and .brd.dxf files.',
    'Annuler': 'Cancel', 'Donner un nom au projet.': 'Give the project a name.',
    'Choisir un seul fichier .lib : celui du projet.': 'Choose a single .lib file: the project one.',
    'Abandonner les modifications du projet en cours ?': 'Discard the changes to the current project?',
    'Modifications non enregistrées': 'Unsaved changes', 'Lecture impossible': 'Cannot read'
  };
  function T(s) { return LANGUE === 'fr' ? s : (EN[s] || s); }
  var $ = function (id) { return document.getElementById(id); };
  var MODULES = ['lib', 'sch', 'brd'];
  var P = { projet: null, actif: null, versionSch: 0, versionBrd: 0 };

  if (LANGUE !== 'fr') {
    document.documentElement.lang = 'en';
    Array.prototype.forEach.call(document.querySelectorAll('#onglets .onglet, #accueil h2, #accueil .sous, #accueil .aide, #accueil button, #texteBandeau, #btMaj'), function (e) { e.textContent = T(e.textContent); });
    $('nomNouveau').placeholder = T($('nomNouveau').placeholder);
  }

  /* --- Modules : chaque <template> est affiché dans son cadre --- */
  function api(m) { var w = $('cadre-' + m).contentWindow; return w && w.AZS_MODULE; }
  function monter(suite) {
    var n = 0;
    MODULES.forEach(function (m) {
      var f = $('cadre-' + m);
      f.onload = function () { f.onload = null; if (++n === MODULES.length) suite(); };
      f.srcdoc = '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>' +
                 $('module-' + m).innerHTML + '</body></html>';

    Array.prototype.forEach.call(document.querySelectorAll('#onglets .onglet'), function (b) { b.classList.toggle('actif', b.getAttribute('data-m') === m); });

  }
  function modifie() {
    if (!P.projet) return false;
    return MODULES.some(function (m) { var a = api(m); return a && a.modifie(); });
  }

  /* --- Circuit : jamais modifié tout seul ; mise à jour proposée quand le schéma a changé --- */
  function enAttente() { var s = api('sch'); return !!(P.projet && s && !s.vide() && P.versionSch !== P.versionBrd); }
  function majBandeau() {

    $('bandeau').className = att && P.actif === 'brd' ? 'visible' : '';
    $('btMaj').textContent = T(b && b.vide() ? 'Importer le schéma' : 'Mettre à jour le circuit');
    $('texteBandeau').textContent = T(b && b.vide() ? 'Circuit vide' : 'Le schéma a changé');
    o.innerHTML = '';

  }
  function majCircuit() {

    majBandeau();

  /* --- Projet --- */
  function nomBase(n) { return String(n || '').replace(/^\s+|\s+$/g, '').replace(/\.lib$/i, '').replace(/\s+/g, '_'); }
  function nommer(base) {

  }
  function creerProjet() {

    if (!base) { $('erreurAccueil').textContent = T('Donner un nom au projet.'); $('nomNouveau').focus(); return; }
    nommer(base);

      });

        api('sch').chargerLib(lib.texte, f);
        if (sch) api('sch').ouvrirSchema(sch.texte, sch.nom); else api('sch').nommer(base + '.sch.dxf');
        api('brd').chargerLib(lib.texte, f);
        if (brd) api('brd').ouvrirBrd(brd.texte, brd.nom); else api('brd').nommer(base + '.brd.dxf');

        P.versionSch = brd ? 0 : 1; P.versionBrd = 0;

        montrer('sch');
      });
    }, function () { $('erreurAccueil').textContent = T('Lecture impossible'); });

    $('accueil').className = 'visible';

  }
  function cacherAccueil() { $('accueil').className = ''; $('nomNouveau').value = ''; }

  /* --- Interface des modules --- */

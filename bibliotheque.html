<!DOCTYPE html>
<!--
================================================================================
 Nom        : bibliotheque.html
 Projet     : azs-cad - CAO de circuits imprimés
 Objet      : Bibliothèque : composants (nom, gabarit, nom des pattes)
              et gabarits normalisés
 Auteur     : Eric PERRET
 Date       : 2026-10-31
 Version    : 0.4.0
 Dépendances: aucune (HTML/CSS/JavaScript natif, fonctionne hors ligne)
 Historique :
   0.1.0  2026-10-31  Lecteur de bibliothèques Eagle .lbr (abandonné)
   0.2.0  2026-10-31  Éditeur au format .lib
   0.3.0  2026-10-31  Chantier 3a : double vue SCH (fond blanc, pattes vertes)
                      et BRD (fond noir, cuivre rouge), assistant « Nouveau
                      composant » (famille, nombre de pattes, aperçu, nom),
                      gabarits normalisés DIL et CMS, ouverture/enregistrement
   0.3.1  2026-10-31  Chantier 3b : nommage des pattes (clic : saisie, Tab =
                      patte suivante ; clic droit : liste des fonctions),
                      tableau Patte | Nom synchronisé, annuler/rétablir
   0.3.2  2026-10-31  Chantier 3d : retouche des gabarits (barre d'outils
                      verticale : pads DIL/CMS, trait, arc, cercle, point,
                      texte ; sélection, cadre, déplacement, rotation,
                      duplication, suppression, propriétés, grille)
   0.3.3  2026-10-31  Chantier 3e : retouche = modifier l'existant (sélection,
                      déplacement, poignées, rotation, suppression, type DIL/CMS
                      changé sur place) ; création dans un mode « Dessiner » ;
                      contour de boîtier en RECT ; >NOM et >VALEUR retirés
   0.4.0  2026-10-31  Interface en français ou en anglais selon la langue du
                      navigateur ; projet renommé azs-cad

 Format .lib (texte, unités mm, angles en degrés sens trigonométrique)
   # commentaire
   PACKAGE <gabarit>
     PAD    <patte> <x> <y> <perçage> <diamètre> <ROND|CARRE|OVALE> [rot]   (DIL)
     SMD    <patte> <x> <y> <largeur> <hauteur> [rot]                       (CMS)
     TRAIT  <x1> <y1> <x2> <y2> <épaisseur>
     RECT   <x1> <y1> <x2> <y2> <épaisseur>
     ARC    <cx> <cy> <rayon> <angle début> <angle fin> <épaisseur>
     CERCLE <cx> <cy> <rayon> <épaisseur>
     POINT  <x> <y> <rayon>
     TEXTE  <x> <y> <hauteur> <rot> <texte…>
   FIN
   COMPOSANT <nom> <gabarit> [gabarit…]
     <fonction> => <patte> [patte…]
   FIN
 Gabarits décrits face dessus. Pads DIL : cuivres 1 à 4 et perçage ;
 pads CMS : cuivre 1 ; traits, rectangles, arcs, cercles, points, textes :
 Texte dessus.
================================================================================
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>azs-cad - Bibliothèque</title>
<style>
  :root{
    --fond:#e9ecf0; --panneau:#fff; --bord:#d6dbe2; --texte:#1f2328;
    --discret:#6b7280; --accent:#1f6feb; --accentClair:#dbe7fd; --survol:#f2f5f9;
    --err:#c62828; --avert:#b26a00; --ok:#2e7d32;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--fond); color:var(--texte);
    font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:230px 1fr 280px;
    grid-template-areas:"barre barre barre" "gauche centre droite" "etat etat etat";
    overflow:hidden;
  }
  button,select,input{font:inherit; color:var(--texte); background:#fff; border:1px solid var(--bord); border-radius:5px; padding:4px 9px}
  button{cursor:pointer; background:#f6f7f9}
  button:hover:not(:disabled){border-color:var(--accent); background:#fff}
  button:disabled{opacity:.45; cursor:default}
  button.principal{background:var(--accent); border-color:var(--accent); color:#fff}
  button.principal:hover:not(:disabled){background:#1a5fd0; color:#fff}
  input:focus,select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accentClair)}

  #barre{grid-area:barre; display:flex; align-items:center; gap:8px; padding:7px 12px; background:var(--panneau); border-bottom:1px solid var(--bord)}
  #barre .titre{font-weight:700; font-size:15px; margin-right:8px}
  #barre .titre span{color:var(--discret); font-weight:400; font-size:12px; margin-left:5px}
  #nomFichier{width:190px}
  #modif{color:var(--avert); font-size:18px; width:12px}
  #fichier{display:none}

  #gauche{grid-area:gauche; background:var(--panneau); border-right:1px solid var(--bord); display:flex; flex-direction:column; min-height:0}
  #filtre{margin:10px 10px 4px; width:calc(100% - 20px)}
  #listes{flex:1; overflow:auto; min-height:0; padding-bottom:10px}
  .section h3{margin:10px 0 4px; padding:0 12px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--discret)}
  .section .ajout{margin:0 10px 6px; width:calc(100% - 20px); text-align:left}
  ul{list-style:none; margin:0; padding:0}
  li.item{padding:5px 12px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; border-left:3px solid transparent; white-space:nowrap}
  li.item:hover{background:var(--survol)}
  li.item.sel{background:var(--accentClair); border-left-color:var(--accent)}
  li.item .nom{overflow:hidden; text-overflow:ellipsis}
  li.item .info{color:var(--discret); font-size:12px; flex:none}

  #centre{grid-area:centre; display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--bord); min-width:0; min-height:0}
  .vue{position:relative; min-width:0; min-height:0; overflow:hidden}
  .vue canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  #vueSch{background:#fff} #vueBrd{background:#000}
  .etiquette{position:absolute; top:8px; left:10px; font-size:11px; font-weight:700; letter-spacing:.08em; padding:2px 7px; border-radius:4px; pointer-events:none}
  #vueSch .etiquette{color:#15803d; background:#ecfdf3}
  #vueBrd .etiquette{color:#f2b8b8; background:#2a1212}
  .vide{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; pointer-events:none; padding:20px; font-size:14px; color:#9aa1ab}

  #droite{grid-area:droite; background:var(--panneau); border-left:1px solid var(--bord); overflow:auto; min-height:0}
  .bloc{padding:12px 14px; border-bottom:1px solid var(--bord)}
  .bloc h4{margin:0 0 8px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--discret)}
  .grandNom{font-size:18px; font-weight:700; width:100%; padding:5px 8px}
  .stat{color:var(--discret); margin-top:6px}
  .boutons{display:flex; flex-wrap:wrap; gap:6px}
  .lien{color:var(--accent); cursor:pointer}
  .lien:hover{text-decoration:underline}
  .accueil{color:var(--discret); line-height:1.7}

  #etat{grid-area:etat; display:flex; gap:18px; padding:4px 12px; background:var(--panneau); border-top:1px solid var(--bord); color:var(--discret); white-space:nowrap; overflow:hidden; font-size:12px}
  #coord{font-family:ui-monospace,Consolas,monospace; color:var(--texte); min-width:200px}
  #msg.erreur{color:var(--err)}
  #bulle{position:fixed; pointer-events:none; background:#1f2328; color:#fff; border-radius:5px; padding:3px 8px; font-size:12px; white-space:pre; display:none; z-index:25}

  #modale{position:fixed; inset:0; background:rgba(20,24,30,.45); display:none; align-items:center; justify-content:center; z-index:40}
  #modale.visible{display:flex}
  .boite{background:#fff; border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,.3); width:min(720px,95vw); overflow:hidden}
  .boite h2{margin:0; padding:14px 18px; font-size:16px; border-bottom:1px solid var(--bord)}
  .boite .corps{display:grid; grid-template-columns:1fr 300px; gap:16px; padding:16px 18px}
  .champ{display:grid; grid-template-columns:100px 1fr; gap:6px; align-items:center; margin-bottom:8px}
  .champ label{color:var(--discret)}
  .champ input,.champ select{width:100%; min-width:0}
  #apercu{width:300px; height:230px; background:#000; border-radius:6px; display:block}
  #apercuInfo{color:var(--discret); font-size:12px; margin-top:6px; min-height:16px}
  #assErreur{color:var(--err); font-size:12px; min-height:16px}
  .boite .pied{display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--bord); background:#fafbfc}
  #barre .espace{flex:1}
  #barre label{color:var(--discret)}
  #modes{position:absolute; top:6px; right:8px; display:flex; gap:6px}
  #modes button{background:#1d1f23; color:#e6e6e6; border-color:#444; font-size:12px}
  #modes button:hover:not(:disabled){border-color:#f2b8b8; background:#2a2d33}
  #modes button.actif{background:#7a1f1f; border-color:#d63b3b; color:#fff}
  #outils.retouche [data-g="d"], #outils.dessin [data-g="r"]{display:none}
  #outils{position:absolute; left:8px; top:40px; display:none; flex-direction:column; gap:3px; background:#1d1f23; border:1px solid #3a3d44; border-radius:7px; padding:4px}
  #outils.visible{display:flex}
  #outils button{width:34px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; background:transparent; border-color:transparent; color:#cfd3da}
  #outils button:hover:not(:disabled){background:#2c3036; border-color:#555}
  #outils button.actif{background:#7a1f1f; border-color:#d63b3b; color:#fff}
  #outils .sep{height:1px; background:#3a3d44; margin:3px 2px}
  #outils svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  #aide{color:var(--texte)}
  table.broches{border-collapse:collapse; width:100%}
  table.broches td{padding:1px 0; border-bottom:1px solid #eef0f3}
  table.broches td.p{width:46px; color:var(--discret); font-variant-numeric:tabular-nums; padding-left:6px}
  table.broches tr.survol td{background:#fef9c3}
  table.broches input{width:100%; border-color:transparent; background:transparent; padding:3px 6px; font-weight:600}
  table.broches input:hover{border-color:var(--bord)}
  table.broches input:focus{background:#fff}
  #saisie{position:fixed; display:none; width:140px; z-index:20; box-shadow:0 3px 12px rgba(0,0,0,.25); font-weight:600}
  #menu{position:fixed; display:none; z-index:30; background:#fff; border:1px solid var(--bord); border-radius:7px; box-shadow:0 6px 20px rgba(0,0,0,.18); padding:4px; min-width:190px}
  #menu .titreMenu{padding:4px 8px 6px; color:var(--discret); font-size:11px; text-transform:uppercase; letter-spacing:.05em}
  #menu .grilleMenu{display:grid; grid-template-columns:repeat(3,1fr); gap:1px}
  #menu .op{padding:4px 8px; border-radius:4px; cursor:pointer; white-space:nowrap}
  #menu .op:hover{background:var(--accentClair)}
  #menu .op.actuel{font-weight:700; color:var(--accent)}
  #menu .sepMenu{height:1px; background:var(--bord); margin:4px 2px}
</style>
</head>
<body>

<div id="barre">
  <span class="titre">azs-cad<span>Bibliothèque 0.4.0</span></span>
  <button id="btNouveau">Nouvelle bibliothèque</button>
  <button id="btOuvrir">Ouvrir…</button>
  <input type="file" id="fichier" accept=".lib,.txt">
  <button id="btEnregistrer" class="principal" title="Ctrl+S">Enregistrer</button>
  <input type="text" id="nomFichier" value="bibliotheque.lib" spellcheck="false">
  <span id="modif"></span>
  <span class="espace"></span>
  <label for="selGrille">Grille</label>
  <select id="selGrille"></select>
</div>

<div id="gauche">
  <input type="text" id="filtre" placeholder="Rechercher…" autocomplete="off">
  <div id="listes">
    <div class="section">
      <h3 id="titreCmp">Composants</h3>
      <button class="ajout principal" id="btNouvCmp">+ Nouveau composant</button>
      <ul id="listeCmp"></ul>
    </div>
    <div class="section">
      <h3 id="titrePkg">Gabarits</h3>
      <button class="ajout" id="btNouvPkg">+ Nouveau gabarit</button>
      <ul id="listePkg"></ul>
    </div>
  </div>
</div>

<div id="centre">
  <div class="vue" id="vueSch">
    <canvas id="cvSch"></canvas>
    <span class="etiquette">SCHÉMA</span>
    <div class="vide" id="videSch">Créer un composant ou ouvrir une bibliothèque</div>
  </div>
  <div class="vue" id="vueBrd">
    <canvas id="cvBrd"></canvas>
    <span class="etiquette">CIRCUIT</span>
    <div id="modes"><button id="btRetouche" disabled>Retoucher</button><button id="btDessin" disabled>Dessiner</button></div>
    <div id="outils">
      <button data-g="r" data-outil="sel" title="Sélection"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg></button>
      <button data-g="d" data-outil="pad" title="Pad DIL"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button data-g="d" data-outil="smd" title="Pad CMS"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="1"/></svg></button>
      <button data-g="d" data-outil="trait" title="Trait (clic droit : fin)"><svg viewBox="0 0 24 24"><path d="M4 19L20 5"/></svg></button>
      <button data-g="d" data-outil="rect" title="Rectangle : deux coins"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg></button>
      <button data-g="d" data-outil="arc" title="Arc : centre, début, fin"><svg viewBox="0 0 24 24"><path d="M4 18A10 10 0 0 1 20 10"/></svg></button>
      <button data-g="d" data-outil="cercle" title="Cercle : centre, rayon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
      <button data-g="d" data-outil="point" title="Point (repère patte 1)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/></svg></button>
      <button data-g="d" data-outil="texte" title="Texte"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg></button>
      <span class="sep"></span>
      <button data-g="r" id="btRot" title="Rotation 90° (R)"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2-5"/><path d="M19 4v4h-4"/></svg></button>
      <button data-g="r" id="btSuppr" title="Supprimer (Suppr)"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>
      <span data-g="r" class="sep"></span>
      <button id="btAnnuler" title="Annuler (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="btRetablir" title="Rétablir (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
  </div>
</div>

<div id="droite"><div id="fiche"></div></div>

<div id="etat">
  <span id="coord">X — Y —</span>
  <span id="aide"></span>
  <span id="msg"></span>
</div>
<div id="bulle"></div>
<input type="text" id="saisie" list="fonctions" spellcheck="false" autocomplete="off">
<datalist id="fonctions"></datalist>
<div id="menu"></div>

<div id="modale">
  <div class="boite">
    <h2 id="assTitre">Nouveau composant</h2>
    <div class="corps">
      <div>
        <div class="champ" id="assLigneNom"><label for="assNom">Nom</label><input type="text" id="assNom" placeholder="ex. NE555" spellcheck="false"></div>
        <div class="champ"><label for="assFamille">Famille</label><select id="assFamille"></select></div>
        <div class="champ"><label for="assVariante">Pattes</label><select id="assVariante"></select></div>
        <div class="champ"><label for="assGab">Gabarit</label><input type="text" id="assGab" spellcheck="false"></div>
        <div id="assErreur"></div>
      </div>
      <div>
        <canvas id="apercu"></canvas>
        <div id="apercuInfo"></div>
      </div>
    </div>
    <div class="pied">
      <button id="assAnnuler">Annuler</button>
      <button id="assCreer" class="principal">Créer</button>
    </div>
  </div>
</div>

  });
  $('btEnregistrer').addEventListener('click', enregistrer);
  document.addEventListener('keydown', function (ev) {
    var t = ev.target.tagName, k = ev.key;
    if ((ev.ctrlKey || ev.metaKey) && (k === 's' || k === 'S')) { ev.preventDefault(); fermerSaisie(true); enregistrer(); return; }
    if (k === 'Escape') fermerMenu();
    if (t === 'INPUT' || t === 'SELECT' || $('modale').className) return;
    if (S.retouche && k === 'Escape') { finAction(); return; }
    if (S.mode === 'retouche') {
      if (k === 'Delete' || k === 'Backspace') { ev.preventDefault(); supprimerSel(); return; }
      if ((k === 'r' || k === 'R') && !ev.ctrlKey && !ev.metaKey) { tournerSel(); return; }
    }
    if ((ev.ctrlKey || ev.metaKey) && (k === 'z' || k === 'Z')) { ev.preventDefault(); if (ev.shiftKey) restaurer(S.retab, S.annul); else restaurer(S.annul, S.retab); }
    else if ((ev.ctrlKey || ev.metaKey) && (k === 'y' || k === 'Y')) { ev.preventDefault(); restaurer(S.retab, S.annul); }
  });
  window.addEventListener('beforeunload', function (ev) { if (S.modifie) { ev.preventDefault(); ev.returnValue = ''; } });
  $('filtre').addEventListener('input', remplirListes);
  $('btNouvCmp').addEventListener('click', function () { ouvrirAssistant('composant'); });
  $('btNouvPkg').addEventListener('click', function () { ouvrirAssistant('gabarit'); });
  window.addEventListener('resize', redimensionner);
  brancher('sch');
  brancher('brd');

  /* Démarrage */
  FONCTIONS.forEach(function (f) { var o = document.createElement('option'); o.value = f; $('fonctions').appendChild(o); });
  [0.05, 0.1, 0.127, 0.25, 0.5, 0.635, 1, 1.27, 2.54, 5].forEach(function (g) {
    var o = document.createElement('option'); o.value = g; o.textContent = String(g).replace('.', ',') + ' mm'; $('selGrille').appendChild(o);
  });
  $('selGrille').value = '1.27';
  $('selGrille').addEventListener('change', function () { S.grille = parseFloat(this.value); dessiner(); });
  $('btRetouche').addEventListener('click', function () { entrerMode('retouche'); });
  $('btDessin').addEventListener('click', function () { entrerMode('dessin'); });
  Array.prototype.forEach.call(document.querySelectorAll('#outils button[data-outil]'), function (b) {
    b.addEventListener('click', function () { choisirOutil(this.getAttribute('data-outil')); });
  });
  $('btRot').addEventListener('click', tournerSel);
  $('btSuppr').addEventListener('click', supprimerSel);
  $('btAnnuler').addEventListener('click', function () { restaurer(S.annul, S.retab); });
  $('btRetablir').addEventListener('click', function () { restaurer(S.retab, S.annul); });
  remplirFamilles();
  remplirListes();
  fiche();
  redimensionner();
  ajuster();
})();
</script>
</body>
</html>
